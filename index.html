<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EAP 2027 | Estágio de Atualização Profissional</title>
<style>
:root{
  --navy-900:#0a1e33; --navy-800:#0f2942; --navy-700:#143a5c;
  --navy-600:#1d4d75; --gold-500:#c9a44a; --gold-400:#e0be6a;
  --g50:#f8fafc; --g100:#f1f5f9; --g200:#e2e8f0; --g300:#cbd5e1;
  --g500:#64748b; --g600:#475569; --g700:#334155; --g900:#0f172a;
  --green:#16a34a; --green-l:#dcfce7; --red:#dc2626; --red-l:#fee2e2;
  --amber:#d97706; --amber-l:#fef3c7; --blue:#2563eb; --blue-l:#dbeafe;
  --shadow-sm:0 1px 3px rgba(15,23,42,.06), 0 1px 2px rgba(15,23,42,.04);
  --shadow:0 4px 12px rgba(15,23,42,.06), 0 2px 4px rgba(15,23,42,.04);
  --shadow-md:0 10px 22px -6px rgba(15,23,42,.12), 0 4px 8px -4px rgba(15,23,42,.06);
  --shadow-lg:0 24px 48px -12px rgba(15,23,42,.25), 0 12px 24px -10px rgba(15,23,42,.12);
  --radius:10px; --radius-lg:16px;

  --cat-cb-sd:#16a34a;
  --cat-cb-sd-dark:#15803d;
  --cat-subten-sgt:#dc2626;
  --cat-subten-sgt-dark:#b91c1c;
  --cat-oficiais:#c9a44a;
  --cat-oficiais-dark:#a8863a;
  --cat-efetivo:#2563eb;
  --cat-efetivo-dark:#1d4ed8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  background:linear-gradient(180deg,#f1f5f9 0%, #e8eef5 100%);
  color:var(--g900); line-height:1.5; font-size:14px;
  -webkit-font-smoothing:antialiased; min-height:100vh;
}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:inherit}

/* ---------- HEADER ---------- */
header{
  background:linear-gradient(135deg,#081a2c 0%, var(--navy-800) 55%, var(--navy-700) 100%);
  color:#fff; padding:20px 28px; box-shadow:0 4px 20px -6px rgba(10,30,51,.4);
  position:sticky; top:0; z-index:50;
  border-bottom:1px solid rgba(201,164,74,.25);
}
.header-wrap{max-width:1600px;margin:0 auto;display:flex;align-items:center;gap:20px;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;align-items:center;gap:16px}
.badge{
  width:54px;height:54px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,var(--gold-400),var(--gold-500) 70%);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;color:var(--navy-900);font-size:15px;letter-spacing:.5px;
  box-shadow:inset 0 -3px 6px rgba(0,0,0,.25),0 4px 12px rgba(201,164,74,.35);
  border:2px solid rgba(255,255,255,.4);
}
.brand h1{font-size:20px;font-weight:700;letter-spacing:.3px}
.brand p{font-size:12px;color:rgba(255,255,255,.72);margin-top:3px}
.header-actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:var(--radius);
  font-size:13px;font-weight:600;transition:all .18s ease;white-space:nowrap;
  box-shadow:0 1px 2px rgba(0,0,0,.05);
}
.btn svg{width:16px;height:16px;flex-shrink:0}
.btn-gold{background:linear-gradient(180deg,var(--gold-400),var(--gold-500));color:var(--navy-900);box-shadow:0 2px 6px rgba(201,164,74,.35)}
.btn-gold:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(201,164,74,.45)}
.btn-ghost{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(6px)}
.btn-ghost:hover{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.35)}
.btn-primary{background:linear-gradient(180deg,var(--navy-700),var(--navy-800));color:#fff}
.btn-primary:hover{background:linear-gradient(180deg,var(--navy-600),var(--navy-700));box-shadow:var(--shadow-md)}
.btn-outline{background:#fff;border:1px solid var(--g300);color:var(--g700)}
.btn-outline:hover{background:var(--g50);border-color:var(--navy-600);color:var(--navy-700)}
.btn-danger{background:linear-gradient(180deg,#ef4444,var(--red));color:#fff}
.btn-danger:hover{background:linear-gradient(180deg,#dc2626,#b91c1c);box-shadow:0 6px 14px rgba(220,38,38,.35)}
.btn-sm{padding:6px 12px;font-size:12px}

/* Indicador de status de conexão */
.conn-status{
  display:inline-flex;align-items:center;gap:6px;padding:5px 10px;
  border-radius:20px;font-size:11px;font-weight:700;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.08);
  color:rgba(255,255,255,.85);
}
.conn-status::before{
  content:'';width:8px;height:8px;border-radius:50%;background:var(--g500);
}
.conn-status.online::before{background:#4ade80;box-shadow:0 0 8px #4ade80}
.conn-status.offline::before{background:#f87171;box-shadow:0 0 8px #f87171}

/* ---------- TABS ---------- */
.tabs-bar{background:#fff;border-bottom:1px solid var(--g200);position:sticky;top:92px;z-index:40;box-shadow:0 2px 8px -4px rgba(15,23,42,.05)}
.tabs{max-width:1600px;margin:0 auto;display:flex;padding:0 28px;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  padding:16px 24px;font-size:14px;font-weight:600;color:var(--g500);
  border-bottom:3px solid transparent;transition:all .18s;white-space:nowrap;
  position:relative;
}
.tab:hover{background:linear-gradient(180deg,transparent,rgba(0,0,0,.03))}
.tab.active{color:var(--g900)}
.tab[data-cat="cb_sd"].active{color:var(--cat-cb-sd-dark);border-bottom-color:var(--cat-cb-sd);}
.tab[data-cat="cb_sd"].active::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--cat-cb-sd),transparent);filter:blur(3px);}
.tab[data-cat="subten_sgt"].active{color:var(--cat-subten-sgt-dark);border-bottom-color:var(--cat-subten-sgt);}
.tab[data-cat="subten_sgt"].active::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--cat-subten-sgt),transparent);filter:blur(3px);}
.tab[data-cat="oficiais"].active{color:var(--cat-oficiais-dark);border-bottom-color:var(--cat-oficiais);}
.tab[data-cat="oficiais"].active::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--cat-oficiais),transparent);filter:blur(3px);}
.tab[data-cat="efetivo"].active{color:var(--cat-efetivo-dark);border-bottom-color:var(--cat-efetivo);}
.tab[data-cat="efetivo"].active::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--cat-efetivo),transparent);filter:blur(3px);}

/* ---------- MAIN ---------- */
main{max-width:1600px;margin:0 auto;padding:26px 28px 60px}

.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:22px}
.stat{
  background:#fff;border-radius:var(--radius-lg);padding:18px 20px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden;
  transition:transform .18s ease, box-shadow .18s ease;
  border:1px solid rgba(226,232,240,.8);
}
.stat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,var(--navy-600),var(--navy-800));}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.stat.green::before{background:linear-gradient(180deg,#4ade80,var(--green))}
.stat.amber::before{background:linear-gradient(180deg,#fbbf24,var(--amber))}
.stat.red::before{background:linear-gradient(180deg,#f87171,var(--red))}
.stat-label{font-size:11px;color:var(--g500);text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.stat-value{font-size:26px;font-weight:800;color:var(--g900);letter-spacing:-.5px}

body[data-cat="cb_sd"] .stat.cat-primary::before{background:linear-gradient(180deg,#4ade80,var(--cat-cb-sd));}
body[data-cat="subten_sgt"] .stat.cat-primary::before{background:linear-gradient(180deg,#f87171,var(--cat-subten-sgt));}
body[data-cat="oficiais"] .stat.cat-primary::before{background:linear-gradient(180deg,var(--gold-400),var(--cat-oficiais));}
body[data-cat="efetivo"] .stat.cat-primary::before{background:linear-gradient(180deg,#60a5fa,var(--cat-efetivo));}

.toolbar{
  display:flex;gap:12px;margin-bottom:22px;flex-wrap:wrap;align-items:center;
  background:#fff;padding:14px;border-radius:var(--radius-lg);box-shadow:var(--shadow);
  border:1px solid rgba(226,232,240,.8);
}
.search-box{flex:1;min-width:220px;position:relative}
.search-box svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--g500);pointer-events:none}
.search-box input{
  width:100%;padding:11px 14px 11px 40px;border:1.5px solid var(--g200);border-radius:var(--radius);
  font-size:13px;transition:all .18s;background:var(--g50);
}
.search-box input:focus{outline:none;border-color:var(--navy-600);background:#fff;box-shadow:0 0 0 4px rgba(20,58,92,.08)}

/* ---------- TURMA CARD ---------- */
.turma{
  background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow);
  margin-bottom:20px;overflow:hidden;border:1px solid rgba(226,232,240,.9);
  transition:box-shadow .2s ease;
}
.turma:hover{box-shadow:var(--shadow-md)}
.turma-head{
  display:flex;align-items:center;gap:16px;padding:16px 20px;
  background:linear-gradient(90deg,var(--navy-800),var(--navy-700));
  color:#fff;cursor:pointer;position:relative;
}
.turma-head::after{content:'';position:absolute;left:0;bottom:0;height:1px;right:0;background:linear-gradient(90deg,transparent,rgba(201,164,74,.4),transparent);}
.turma::before{content:'';display:block;height:4px;background:linear-gradient(90deg,var(--navy-600),var(--navy-800));}
body[data-cat="cb_sd"] .turma::before{background:linear-gradient(90deg,var(--cat-cb-sd),var(--cat-cb-sd-dark));}
body[data-cat="subten_sgt"] .turma::before{background:linear-gradient(90deg,var(--cat-subten-sgt),var(--cat-subten-sgt-dark));}
body[data-cat="oficiais"] .turma::before{background:linear-gradient(90deg,var(--gold-400),var(--cat-oficiais));}
body[data-cat="efetivo"] .turma::before{background:linear-gradient(90deg,var(--cat-efetivo),var(--cat-efetivo-dark));}

.turma-num{
  width:46px;height:46px;border-radius:12px;
  background:linear-gradient(180deg,var(--gold-400),var(--gold-500));color:var(--navy-900);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;
  flex-shrink:0;box-shadow:inset 0 -2px 4px rgba(0,0,0,.15),0 2px 6px rgba(201,164,74,.35);
  border:1px solid rgba(255,255,255,.35);
}
.turma-info{flex:1;min-width:0}
.turma-title{font-size:15px;font-weight:700;letter-spacing:.2px}
.turma-dates{font-size:12px;color:rgba(255,255,255,.72);margin-top:3px;display:flex;gap:14px;flex-wrap:wrap}
.turma-dates span{display:inline-flex;align-items:center;gap:5px}
.turma-count{
  background:rgba(255,255,255,.14);padding:7px 14px;border-radius:20px;
  font-size:12px;font-weight:600;border:1px solid rgba(255,255,255,.18);
  backdrop-filter:blur(4px);
}
.turma-chevron{width:20px;height:20px;transition:transform .25s ease;flex-shrink:0;opacity:.85}
.turma.collapsed .turma-chevron{transform:rotate(-90deg)}
.turma.collapsed .turma-body{display:none}

.turma-body{padding:0}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{
  background:linear-gradient(180deg,#f8fafc,#f1f5f9);text-align:left;padding:12px 14px;font-weight:700;font-size:11px;
  text-transform:uppercase;letter-spacing:.5px;color:var(--g600);border-bottom:1px solid var(--g200);
  white-space:nowrap;position:sticky;top:0;
}
tbody td{padding:12px 14px;border-bottom:1px solid var(--g100);vertical-align:middle}
tbody tr{transition:background .12s}
tbody tr:hover{background:linear-gradient(90deg,rgba(201,164,74,.04),rgba(20,58,92,.03))}
tbody tr:last-child td{border-bottom:none}
.cell-re{font-family:'SF Mono',Monaco,Consolas,monospace;font-weight:700;color:var(--navy-700);letter-spacing:.5px}
.cell-nome{font-weight:500;min-width:180px}
.cell-muted{color:var(--g500);font-size:12px}

.pill{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.2px;white-space:nowrap;}
.pill-green{background:var(--green-l);color:#15803d;border:1px solid rgba(22,163,74,.2)}
.pill-red{background:var(--red-l);color:#b91c1c;border:1px solid rgba(220,38,38,.2)}
.pill-amber{background:var(--amber-l);color:#b45309;border:1px solid rgba(217,119,6,.2)}
.pill-blue{background:var(--blue-l);color:#1d4ed8;border:1px solid rgba(37,99,235,.2)}
.pill-gray{background:var(--g200);color:var(--g700);border:1px solid rgba(100,116,139,.15)}

.row-actions{display:flex;gap:4px;justify-content:flex-end}
.row-btn{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--g500);transition:all .15s;}
.row-btn:hover{background:var(--g100);color:var(--navy-700);transform:scale(1.06)}
.row-btn.danger:hover{background:var(--red-l);color:var(--red)}
.row-btn svg{width:14px;height:14px}

.empty-state{text-align:center;padding:60px 20px;color:var(--g500)}
.empty-state svg{width:64px;height:64px;opacity:.35;margin-bottom:16px;color:var(--navy-600)}
.empty-state h3{color:var(--g700);font-size:16px;margin-bottom:8px}
.empty-state p{font-size:13px;max-width:440px;margin:0 auto;line-height:1.6}

/* ---------- OBSERVAÇÕES DA TURMA ---------- */
.turma-obs{display:flex;gap:10px;padding:12px 20px;background:linear-gradient(180deg,#fffbeb,#fef9ec);border-bottom:1px solid #fcd34d;align-items:flex-start;}
.turma-obs svg{width:16px;height:16px;color:var(--amber);flex-shrink:0;margin-top:2px}
.turma-obs-content{flex:1;min-width:0}
.turma-obs-label{font-size:10px;font-weight:800;color:#b45309;text-transform:uppercase;letter-spacing:.6px;margin-bottom:3px;}
.turma-obs-text{font-size:13px;color:var(--g700);white-space:pre-wrap;line-height:1.5;word-break:break-word;}

/* ---------- MODAL ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(10,30,51,.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;animation:fadeIn .2s ease;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(16px) scale(.98);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
.modal{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:100%;max-width:860px;max-height:92vh;display:flex;flex-direction:column;animation:slideUp .25s cubic-bezier(.16,1,.3,1);overflow:hidden;}
.modal.sm{max-width:540px}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--g200);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:linear-gradient(180deg,#fff,var(--g50));position:relative;}
.modal-head::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--gold-400),var(--gold-500));}
.modal-head h2{font-size:17px;font-weight:700;color:var(--g900);letter-spacing:-.2px;padding-left:6px}
.modal-close{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--g500);transition:all .15s}
.modal-close:hover{background:var(--red-l);color:var(--red);transform:rotate(90deg)}
.modal-body{padding:24px;overflow-y:auto;flex:1}
.modal-foot{padding:16px 24px;border-top:1px solid var(--g200);display:flex;justify-content:flex-end;gap:10px;flex-shrink:0;background:var(--g50);}

/* ---------- FORM ---------- */
.form-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field.col-3{grid-column:span 3}
.field.col-4{grid-column:span 4}
.field.col-6{grid-column:span 6}
.field.col-8{grid-column:span 8}
.field.col-12{grid-column:span 12}
.field label{font-size:11px;font-weight:700;color:var(--g600);text-transform:uppercase;letter-spacing:.5px;}
.field label .req{color:var(--red);font-weight:800}
.field input,.field select,.field textarea{padding:10px 13px;border:1.5px solid var(--g200);border-radius:var(--radius);font-size:13px;background:#fff;transition:all .18s;width:100%;color:var(--g900);}
.field textarea{resize:vertical;min-height:88px;line-height:1.5;font-family:inherit}
.field input:hover,.field select:hover,.field textarea:hover{border-color:var(--g300)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--navy-600);background:#fff;box-shadow:0 0 0 4px rgba(20,58,92,.1);}
.field input:disabled,.field select:disabled{background:var(--g100);color:var(--g500);cursor:not-allowed}
.field .hint{font-size:11px;color:var(--g500);line-height:1.4}

.auto-number-badge{display:inline-flex;align-items:center;gap:5px;margin-top:4px;font-size:11px;font-weight:700;color:#15803d;background:var(--green-l);padding:5px 9px;border-radius:6px;width:fit-content;}
.auto-number-badge svg{width:12px;height:12px}

.section-title{grid-column:span 12;font-size:12px;font-weight:800;color:var(--navy-700);text-transform:uppercase;letter-spacing:.8px;padding:6px 0 6px 12px;margin-top:8px;position:relative;}
.section-title::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:3px;background:linear-gradient(180deg,var(--gold-500),var(--gold-400));border-radius:2px;}

.conditional-group{display:none}
.conditional-group.show{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;grid-column:span 12;padding:16px;background:linear-gradient(135deg,#fffbeb,#fef3c7);border-radius:var(--radius);border:1px solid #fcd34d;animation:slideUp .2s ease;}

/* ---------- CHECKBOX WRAP ---------- */
.checkbox-wrap{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:44px;border:1.5px solid var(--g200);border-radius:var(--radius);background:#fff;cursor:pointer;font-size:13px;transition:all .18s;user-select:none;}
.checkbox-wrap:hover{background:var(--g50);border-color:var(--g300)}
.checkbox-wrap input{width:18px;height:18px;cursor:pointer;flex-shrink:0;accent-color:var(--navy-700);}
.checkbox-wrap span{color:var(--g700);font-weight:600}
.checkbox-wrap.checked{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border-color:var(--green);box-shadow:0 0 0 3px rgba(22,163,74,.1);}
.checkbox-wrap.checked span{color:#065f46}

/* ---------- RE AUTO-FILL BADGE ---------- */
.re-autofill{display:none;font-size:11px;color:var(--green);font-weight:700;align-items:center;gap:5px;margin-top:4px;padding:5px 9px;background:var(--green-l);border-radius:6px;width:fit-content;}
.re-autofill.show{display:flex;animation:slideUp .2s ease}
.re-autofill svg{width:12px;height:12px}
.re-autofill.warn{color:#b45309;background:var(--amber-l)}
.re-autofill.info{color:#1d4ed8;background:var(--blue-l)}

/* ---------- TOAST ---------- */
#toasts{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{background:linear-gradient(180deg,var(--g900),#1a2438);color:#fff;padding:14px 20px;border-radius:var(--radius);box-shadow:var(--shadow-lg);font-size:13px;font-weight:500;display:flex;align-items:center;gap:12px;animation:slideUp .25s cubic-bezier(.16,1,.3,1);min-width:280px;max-width:440px;border:1px solid rgba(255,255,255,.08);}
.toast::before{content:'';width:8px;height:8px;border-radius:50%;flex-shrink:0}
.toast-success::before{background:var(--green);box-shadow:0 0 12px var(--green)}
.toast-error::before{background:var(--red);box-shadow:0 0 12px var(--red)}
.toast-info::before{background:var(--blue);box-shadow:0 0 12px var(--blue)}

@media (max-width:768px){
  header{padding:16px}
  .tabs{padding:0 16px}
  main{padding:16px}
  .field.col-3,.field.col-4,.field.col-6,.field.col-8{grid-column:span 12}
  .brand h1{font-size:17px}
  .brand p{display:none}
  .stats-row{grid-template-columns:repeat(2,1fr)}
  .stat-value{font-size:22px}
}

/* ----- Turma concluída ----- */
.turma.concluida{border-color:var(--green);box-shadow:0 0 0 2px rgba(22,163,74,.12), 0 8px 24px -6px rgba(22,163,74,.2);}
.turma.concluida .turma-head{background:linear-gradient(90deg,#0f3d23,#15803d)}

/* ============================================================

function escapeHTML(s){
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function fmtDate(iso){
  if (!iso) return '—';
  const d = new Date(iso + (iso.length === 10 ? 'T00:00:00' : ''));
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('pt-BR');
}
function fmtDateShort(iso){
  if (!iso) return '—';
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d)) return iso;
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = d.toLocaleString('pt-BR',{month:'short'}).replace('.','').toUpperCase();
  const yy = String(d.getFullYear()).slice(2);
  return `${dd}${mm}${yy}`;
}
function addDays(iso, days){
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0,10);
}
function romanToInt(r){
  const map = {I:1,V:5,X:10,L:50,C:100,D:500,M:1000};
  let n = 0;
  const s = String(r||'').toUpperCase();
  if (!s) return 999;
  for (let i=0;i<s.length;i++){
    const c = map[s[i]]; const nx = map[s[i+1]];
    if (!c) return 999;
    if (nx && c < nx) n -= c; else n += c;
  }
  return n || 999;
}
function intToRoman(num){
  if (!num || num < 1 || num > 3999) return String(num);
  const map = [
    ['M',1000],['CM',900],['D',500],['CD',400],
    ['C',100],['XC',90],['L',50],['XL',40],
    ['X',10],['IX',9],['V',5],['IV',4],['I',1]
  ];
  let out = '';
  for (const [sym, val] of map){
    while (num >= val){ out += sym; num -= val; }
  }
  return out;
}
function proximaNumeracaoTurma(categoria){
  const turmas = db.turmas.filter(t => t.categoria === categoria);
  let maior = 0;
  turmas.forEach(t => {
    const s = String(t.numero || '').toUpperCase().trim();
    if (!/^[IVXLCDM]+$/.test(s)) return;
    const n = romanToInt(s);
    if (n !== 999 && n > maior) maior = n;
  });
  return intToRoman(maior + 1);
}
function toast(msg, type='info'){

  setTimeout(() => { el.style.opacity='0'; el.style.transition='opacity .3s'; }, 3000);

}
function sortTurmas(a,b){
  const da  = a.dataInicio || '9999-99-99';
  const dbb = b.dataInicio || '9999-99-99';
  if (da !== dbb) return da.localeCompare(dbb);
  return romanToInt(a.numero) - romanToInt(b.numero);
}

function normalizeCategory(v){

  if (['subten_sgt','subten/sgt','subten sgt','sgt','subtenente','st/sgt'].includes(s)) return 'subten_sgt';
  if (['cb_sd','cb/sd','cb sd','cabo','soldado','cabo/soldado'].includes(s)) return 'cb_sd';
  return null;
}
function normalizeDate(v){
  if (!v) return '';
  v = String(v).trim();
  if (!v) return '';
  if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
  const m = v.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2,4})$/);
  if (m){
    let [_, d, mo, y] = m;
    if (y.length === 2) y = (parseInt(y, 10) > 50 ? '19' : '20') + y;
    const dd = String(d).padStart(2, '0');
    const mm = String(mo).padStart(2, '0');
    return `${y}-${mm}-${dd}`;
  }
  return '';
}

/* ============================================================
   CSV PARSER / WRITER
   ============================================================ */
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i=0;i<text.length;i++){
    const c = text[i];
    if (inQuotes){
      if (c === '"'){
        if (text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',' || c === ';'){ row.push(field); field=''; }
      else if (c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if (c === '\r') {}
      else field += c;
    }
  }
  if (field !== '' || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length && r.some(c => c !== ''));
}
function downloadCSV(rows, filename){
  const esc = v => {
    v = v == null ? '' : String(v);
    if (/[",;\n]/.test(v)) return '"' + v.replace(/"/g,'""') + '"';
    return v;
  };
  const csv = rows.map(r => r.map(esc).join(';')).join('\r\n');
  const blob = new Blob(['\uFEFF' + csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function downloadXLSX(sheets, filename){
  if (typeof XLSX === 'undefined'){
    toast('Biblioteca de Excel não carregada.', 'error');
    return;
  }
  const wb = XLSX.utils.book_new();
  sheets.forEach(({ name, rows }) => {
    const ws = XLSX.utils.aoa_to_sheet(rows);
    const colWidths = [];
    rows.forEach(r => {
      (r || []).forEach((c, i) => {
        const len = String(c ?? '').length + 2;
        if (!colWidths[i] || colWidths[i] < len) colWidths[i] = len;
      });
    });
    ws['!cols'] = colWidths.map(w => ({ wch: Math.min(Math.max(w || 10, 10), 60) }));
    XLSX.utils.book_append_sheet(wb, ws, name);
  });
  XLSX.writeFile(wb, filename);
}

function renderStats(){
  const isEfetivo = state.activeCategory === 'efetivo';
  const officers = isEfetivo
    ? db.officers
    : db.officers.filter(o => o.categoria === state.activeCategory);
  const turmas = isEfetivo
    ? db.turmas
    : db.turmas.filter(t => t.categoria === state.activeCategory);

  const total          = officers.length;
  const eadInseridos   = officers.filter(o => o.inseridoEAD === 'Sim').length;
  const eadConcluidos  = officers.filter(o => o.concluiuEAD === 'Sim').length;
  const tafIV          = officers.filter(o => o.taf === 'IV').length;

  document.getElementById('stats').innerHTML = `
    <div class="stat cat-primary"><span class="stat-label">${isEfetivo ? 'Total Cadastrado' : 'Turmas'}</span><span class="stat-value">${isEfetivo ? total : turmas.length}</span></div>
    <div class="stat"><span class="stat-label">Efetivo Total</span><span class="stat-value">${total}</span></div>
    <div class="stat green"><span class="stat-label">EAD Concluído</span><span class="stat-value">${eadConcluidos}</span></div>
    <div class="stat amber"><span class="stat-label">EAD Inserido</span><span class="stat-value">${eadInseridos}</span></div>
    <div class="stat red"><span class="stat-label">TAF IV (Restrições)</span><span class="stat-value">${tafIV}</span></div>
  `;
}

function renderContent(){
  const container = document.getElementById('content');
  const q = state.search.trim().toLowerCase();

  const officerMatches = o => {
    if (!q) return true;
    return [o.re,o.nome,o.ciaSecao,o.postoGrad,o.turma,o.taf].some(v =>
      String(v||'').toLowerCase().includes(q)
    );
  };

  /* ---- MODO EFETIVO 3º B.C. (todas as categorias juntas) ---- */
  if (state.activeCategory === 'efetivo'){
    const todos = db.officers.filter(officerMatches);

    if (todos.length === 0){
      container.innerHTML = `
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M9 7a4 4 0 100 8 4 4 0 000-8zM23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
          <h3>Nenhum policial no Efetivo 3º B.C.</h3>
          <p>Clique em <strong>"Importar Base"</strong> para carregar a planilha com todos os policiais.</p>
        </div>`;
      return;
    }

    let html = '';
    REAL_CATEGORIES.forEach(cat => {
      const grupo = todos.filter(o => o.categoria === cat.id);
      if (grupo.length === 0) return;
      html += renderTurma({
        id: '__efetivo_' + cat.id,
        numero: cat.label,
        categoria: cat.id,
        dataInicio: '',
        dataFim: '',
        _virtual: true,
        _tituloCustom: 'Efetivo 3º B.C. — ' + cat.label
      }, grupo);
    });

    const semCat = todos.filter(o => !REAL_CATEGORIES.find(c => c.id === o.categoria));
    if (semCat.length){
      html += renderTurma({
        id: '__efetivo_outros',
        numero: '—',
        categoria: 'cb_sd',
        dataInicio: '',
        dataFim: '',
        _virtual: true,
        _tituloCustom: 'Efetivo 3º B.C. — Não classificados'
      }, semCat);
    }

    container.innerHTML = html;
    bindTurmaEvents(container);
    return;
  }

  /* ---- MODO NORMAL (por categoria) ---- */
  let turmas = db.turmas.filter(t => t.categoria === state.activeCategory).sort(sortTurmas);

  if (q){
    turmas = turmas.map(t => ({
      ...t,
      _filtered: db.officers.filter(o => o.turmaId === t.id && officerMatches(o))
    })).filter(t => t._filtered.length > 0);
  } else {
    turmas = turmas.map(t => ({
      ...t,
      _filtered: db.officers.filter(o => o.turmaId === t.id)
    }));
  }

  /* >>> "Sem turma" foi removido: policiais sem turma só aparecem no Efetivo 3º B.C. <<< */

  if (turmas.length === 0){
    container.innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 12h6m-6 4h6M9 8h6M5 3h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2z"/></svg>
        <h3>Nenhuma turma cadastrada</h3>
        <p>Clique em <strong>"Nova Turma"</strong> para começar a organizar o efetivo. Policiais sem turma aparecem no <strong>Efetivo 3º B.C.</strong></p>
      </div>`;
    return;
  }

  let html = '';
  turmas.forEach(t => html += renderTurma(t, t._filtered));
  container.innerHTML = html;
  bindTurmaEvents(container);
}

function bindTurmaEvents(container){
  container.querySelectorAll('.turma-head').forEach(head => {
    head.addEventListener('click', e => {
      if (e.target.closest('.turma-actions, .turma-check')) return;
      head.closest('.turma').classList.toggle('collapsed');
    });
  });

  container.querySelectorAll('[data-action]:not(input[type="checkbox"])').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const action  = btn.dataset.action;
      const id      = btn.dataset.id;
      const turmaId = btn.dataset.turma;
      if (action === 'edit-officer')  openOfficerModal(db.officers.find(o => o.id === id));
      if (action === 'del-officer')   confirmDeleteOfficer(id);
      if (action === 'edit-turma')    openTurmaModal(db.turmas.find(t => t.id === turmaId));
      if (action === 'del-turma')     confirmDeleteTurma(turmaId);
      if (action === 'add-to-turma')  openOfficerModal(null, turmaId);
      if (action === 'export-turma')  exportTurma(turmaId);
    });
  });

  container.querySelectorAll('input[type="checkbox"][data-action="toggle-concluida"]').forEach(cb => {
    cb.addEventListener('click', e => e.stopPropagation());
    cb.addEventListener('change', e => {
      e.stopPropagation();
      toggleTurmaConcluida(cb.dataset.turma, cb.checked);
    });
  });
}

function renderTurma(t, officers){
  const isVirtual = !!t._virtual;
  const isConcluida = !!t.concluida;
  const obs = (t.observacoes || '').trim();
  const titulo = t._tituloCustom || ('Turma ' + t.numero);
  const badgeNum = isVirtual ? '★' : t.numero;

  const rows = officers.length === 0
    ? `<tr><td colspan="12" style="text-align:center;color:var(--g500);padding:28px;font-size:13px">
         Nenhum policial nesta turma.
       </td></tr>`
    : officers.map(o => renderOfficerRow(o)).join('');

  const obsBlock = obs ? `
    <div class="turma-obs">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12h6m-6 4h6M9 8h6M5 3h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2z"/></svg>
      <div class="turma-obs-content">
        <div class="turma-obs-label">Observações da Turma</div>

  return `
    <div class="turma ${isConcluida ? 'concluida' : ''}">
      <div class="turma-head">
        <div class="turma-num">${escapeHTML(badgeNum)}</div>
        <div class="turma-info">
          <div class="turma-title">
            ${escapeHTML(titulo)}
            ${isConcluida ? '<span style="margin-left:8px;font-size:10px;background:#4ade80;color:#052e16;padding:3px 9px;border-radius:20px;font-weight:800;letter-spacing:.5px">✓ CONCLUÍDA</span>' : ''}
          </div>
          <div class="turma-dates">
            ${t.dataInicio ? `<span>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>
              ${fmtDateShort(t.dataInicio)} a ${fmtDateShort(t.dataFim)}
            </span>` : ''}
          </div>
        </div>

        <div class="turma-count">${officers.length} policial${officers.length===1?'':'is'}</div>

        ${!isVirtual ? `
          <label class="turma-check" title="Marcar turma como concluída" onclick="event.stopPropagation()">
            <input type="checkbox" data-action="toggle-concluida" data-turma="${t.id}" ${isConcluida?'checked':''}>
            <span>Concluída</span>
          </label>

          <div class="turma-actions">
            <button class="btn" title="Incluir policial nesta turma" data-action="add-to-turma" data-turma="${t.id}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
              Incluir Policial
            </button>
            <button class="btn btn-export" title="Extrair turma em Excel (.xlsx)" data-action="export-turma" data-turma="${t.id}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12h6m-6 4h6M9 8h6M5 3h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2z"/></svg>
              Extrair Excel
            </button>
            <button class="btn" title="Editar turma" data-action="edit-turma" data-turma="${t.id}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
              Editar
            </button>
            <button class="btn" title="Excluir turma" data-action="del-turma" data-turma="${t.id}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m2 0v14a2 2 0 01-2 2H8a2 2 0 01-2-2V6h12z"/></svg>
              Excluir
            </button>
          </div>
        ` : `
          <div class="turma-actions">
            <button class="btn btn-export" title="Extrair em Excel (.xlsx)" data-action="export-turma" data-turma="${t.id}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12h6m-6 4h6M9 8h6M5 3h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2z"/></svg>
              Extrair Excel
            </button>
          </div>
        `}

        <svg class="turma-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      ${obsBlock}
      <div class="turma-body">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Posto/Grad</th><th>RE</th><th>Dg</th><th>Nome</th><th>TAF</th>
                <th>Cia/Seção</th><th>Nasc.</th><th>Ex. Méd.</th><th>Ex. Odon.</th>
                <th>Val. IAS</th><th>EAD</th><th style="text-align:right">Ações</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>
    </div>
  `;
}

function renderOfficerRow(o){
  const tafPill = o.taf === 'IV'
    ? `<span class="pill pill-red" title="${escapeHTML(o.tafIVTipo||'')}">IV — ${escapeHTML((o.tafIVTipo||'').split(' ')[0]||'Restrição')}</span>`
    : `<span class="pill pill-blue">${escapeHTML(o.taf||'—')}</span>`;

  let ead = '<span class="pill pill-gray">Não inserido</span>';
  if (o.inseridoEAD === 'Sim'){
    if (o.concluiuEAD === 'Sim'){
      ead = `<span class="pill pill-green" title="Nota: ${escapeHTML(o.notaEAD||'—')} • Concluído: ${fmtDate(o.dataConclusaoEAD)}">Concluído${o.notaEAD?` • ${escapeHTML(o.notaEAD)}`:''}</span>`;
    } else {
      ead = `<span class="pill pill-amber">Inserido, não concluiu</span>`;
    }

  return `
    <tr>
      <td>${escapeHTML(o.postoGrad||'—')}</td>
      <td class="cell-re">${escapeHTML(o.re||'—')}</td>
      <td>${escapeHTML(o.dg||'—')}</td>
      <td class="cell-nome">${escapeHTML(o.nome||'—')}</td>
      <td>${tafPill}</td>
      <td>${escapeHTML(o.ciaSecao||'—')}</td>
      <td class="cell-muted">${fmtDate(o.dataNascimento)}</td>
      <td class="cell-muted">${fmtDate(o.dataExameMedico)}</td>
      <td class="cell-muted">${fmtDate(o.dataExameOdonto)}</td>
      <td class="cell-muted">${fmtDate(o.validadeIAS)}</td>
      <td>${ead}</td>
      <td>
        <div class="row-actions">
          <button class="row-btn" title="Editar" data-action="edit-officer" data-id="${o.id}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          </button>
          <button class="row-btn danger" title="Excluir" data-action="del-officer" data-id="${o.id}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m2 0v14a2 2 0 01-2 2H8a2 2 0 01-2-2V6h12z"/></svg>
          </button>
        </div>
      </td>
    </tr>
  `;
}

/* ============================================================
   MODAL GENÉRICO
   ============================================================ */
function openModal({ title, bodyHTML, footerHTML, size='' }){
  const root = document.getElementById('modal-root');
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal ${size}">
      <div class="modal-head">
        <h2>${escapeHTML(title)}</h2>
        <button class="modal-close" data-close>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body">${bodyHTML}</div>
      ${footerHTML ? `<div class="modal-foot">${footerHTML}</div>` : ''}
    </div>
  `;
  root.innerHTML = '';
  root.appendChild(overlay);

  const close = () => { root.innerHTML = ''; };
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
  overlay.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', close));
  const onEsc = e => { if (e.key === 'Escape'){ close(); document.removeEventListener('keydown', onEsc); } };
  document.addEventListener('keydown', onEsc);
  return { close, overlay };
}

   MODAL — POLICIAL
   ============================================================ */
function openOfficerModal(officer = null, presetTurmaId = null){
  const isEdit = !!officer;
  const categoriaInicial = isEdit
    ? officer.categoria
    : (state.activeCategory === 'efetivo' ? 'cb_sd' : state.activeCategory);

  const o = officer || {
    categoria: categoriaInicial, turmaId: presetTurmaId || '',
    postoGrad:'', re:'', dg:'', nome:'', taf:'III', tafIVTipo:'', ciaSecao:'',
    dataNascimento:'', dataExameMedico:'', dataExameOdonto:'', validadeIAS:'',
    inseridoEAD:'Não', concluiuEAD:'Não', notaEAD:'', dataConclusaoEAD:''
  };

  const turmas = db.turmas.filter(t => t.categoria === o.categoria).sort(sortTurmas);
  const turmaOptions = ['<option value="">— Sem turma (Efetivo 3º B.C.) —</option>']
    .concat(turmas.map(t => `<option value="${t.id}" ${t.id===o.turmaId?'selected':''}>Turma ${escapeHTML(t.numero)}</option>`)).join('');

  const catOptions = REAL_CATEGORIES.map(c =>
    `<option value="${c.id}" ${c.id===o.categoria?'selected':''}>${c.label}</option>`
  ).join('');
  const postosOptions = POSTOS.map(p => `<option value="${p}">`).join('');
  const tafIVOptions = TAF_IV_OPTIONS.map(t =>
    `<option value="${t}" ${t===o.tafIVTipo?'selected':''}>${t}</option>`
  ).join('');

  const body = `
    <form id="officer-form" autocomplete="off">
      <div class="form-grid">
        <div class="field col-6">
          <label>Categoria <span class="req">*</span></label>
          <select name="categoria" required>${catOptions}</select>
        </div>
        <div class="field col-6">
          <label>Turma</label>
          <select name="turmaId">${turmaOptions}</select>
          <span class="hint">Deixe em "Sem turma" para o policial aparecer apenas no Efetivo 3º B.C.</span>
        </div>

        <div class="section-title">Identificação</div>

        <div class="field col-4">
          <label>Posto / Graduação <span class="req">*</span></label>
          <input name="postoGrad" list="postos" required value="${escapeHTML(o.postoGrad)}" placeholder="Ex.: 1° SGT PM">
          <datalist id="postos">${postosOptions}</datalist>
        </div>
        <div class="field col-4">
          <label>RE <span class="req">*</span></label>
          <input name="re" maxlength="6" pattern="\\d{6}" inputmode="numeric" required
                 value="${escapeHTML(o.re)}" placeholder="6 dígitos">
          <div class="re-autofill" id="re-autofill">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
            <span id="re-autofill-text">Dados preenchidos automaticamente</span>
          </div>
        </div>
        <div class="field col-4">
          <label>Dg <span class="req">*</span></label>
          <input name="dg" maxlength="1" required value="${escapeHTML(o.dg)}" placeholder="Ex.: A">
        </div>

        <div class="field col-12">
          <label>Nome Completo <span class="req">*</span></label>
          <input name="nome" required value="${escapeHTML(o.nome)}" placeholder="Nome de guerra ou completo">
        </div>

        <div class="field col-6">
          <label>Cia / Seção <span class="req">*</span></label>
          <input name="ciaSecao" required value="${escapeHTML(o.ciaSecao)}" placeholder="Ex.: 3 CIA PM">
        </div>
        <div class="field col-3">
          <label>TAF <span class="req">*</span></label>
          <select name="taf" required>
            <option value="III" ${o.taf==='III'?'selected':''}>III</option>
            <option value="IV"  ${o.taf==='IV'?'selected':''}>IV</option>
          </select>
        </div>
        <div class="field col-3"></div>

        <div class="conditional-group" id="taf-iv-group">
          <div class="field col-6">
            <label>Tipo de Restrição (TAF IV) <span class="req">*</span></label>
            <select name="tafIVTipo" id="tafIVTipo">
              <option value="">— Selecione —</option>
              ${tafIVOptions}
            </select>
          </div>
        </div>

        <div class="section-title">Datas</div>
        <div class="field col-3">
          <label>Data de Nascimento</label>
          <input type="date" name="dataNascimento" value="${o.dataNascimento||''}">
        </div>
        <div class="field col-3">
          <label>Exame Médico</label>
          <input type="date" name="dataExameMedico" value="${o.dataExameMedico||''}">
        </div>
        <div class="field col-3">
          <label>Exame Odontológico</label>
          <input type="date" name="dataExameOdonto" value="${o.dataExameOdonto||''}">
        </div>
        <div class="field col-3">
          <label>Validade IAS</label>
          <input type="date" name="validadeIAS" value="${o.validadeIAS||''}">
        </div>

        <div class="section-title">EAD</div>

        <div class="field col-6">
          <label>Inserido no EAD?</label>
          <label class="checkbox-wrap ${o.inseridoEAD==='Sim'?'checked':''}" id="wrap-inserido">
            <input type="checkbox" name="inseridoEAD" id="inseridoEAD" ${o.inseridoEAD==='Sim'?'checked':''}>
            <span>Sim, inserido no EAD</span>
          </label>
        </div>
        <div class="field col-6">
          <label>Concluiu o EAD?</label>
          <label class="checkbox-wrap ${o.concluiuEAD==='Sim'?'checked':''}" id="wrap-concluiu">
            <input type="checkbox" name="concluiuEAD" id="concluiuEAD" ${o.concluiuEAD==='Sim'?'checked':''}>
            <span>Sim, concluiu o EAD</span>
          </label>
        </div>

        <div class="conditional-group" id="ead-concluido-group">
          <div class="field col-4">
            <label>Nota EAD</label>
            <input name="notaEAD" value="${escapeHTML(o.notaEAD)}" placeholder="Ex.: 9,5">
          </div>
          <div class="field col-8">
            <label>Data de Conclusão do EAD</label>
            <input type="date" name="dataConclusaoEAD" value="${o.dataConclusaoEAD||''}">
            <span class="hint">Deixe vazio se ainda não concluiu — aparecerá como "Não Concluído".</span>
          </div>
        </div>
      </div>
    </form>
  `;

  const footer = `
    <button class="btn btn-outline" data-close>Cancelar</button>
    <button class="btn btn-primary" id="save-officer">${isEdit?'Salvar Alterações':'Adicionar Policial'}</button>
  `;

  const { close } = openModal({
    title: isEdit ? 'Editar Policial' : 'Novo Policial',
    bodyHTML: body, footerHTML: footer
  });

  const form        = document.getElementById('officer-form');
  const tafSel      = form.querySelector('[name="taf"]');
  const tafIVGroup  = document.getElementById('taf-iv-group');
  const tafIVSel    = document.getElementById('tafIVTipo');
  const inseridoSel = form.querySelector('[name="inseridoEAD"]');
  const concluiuSel = form.querySelector('[name="concluiuEAD"]');
  const wrapInserido = document.getElementById('wrap-inserido');
  const wrapConcluiu = document.getElementById('wrap-concluiu');
  const eadGroup    = document.getElementById('ead-concluido-group');
  const reInput     = form.querySelector('[name="re"]');
  const autoFillBadge = document.getElementById('re-autofill');
  const autoFillText  = document.getElementById('re-autofill-text');
  const catSel      = form.querySelector('[name="categoria"]');
  const turmaSel    = form.querySelector('[name="turmaId"]');

  function refreshTurmas(){
    const lista = db.turmas.filter(t => t.categoria === catSel.value).sort(sortTurmas);
    const atual = turmaSel.value;
    turmaSel.innerHTML = '<option value="">— Sem turma (Efetivo 3º B.C.) —</option>' +
      lista.map(t => `<option value="${t.id}">Turma ${escapeHTML(t.numero)}</option>`).join('');
    if (atual && lista.find(t => t.id === atual)) turmaSel.value = atual;
  }
  catSel.addEventListener('change', refreshTurmas);

  function updateTafIV(){
    const isIV = tafSel.value === 'IV';
    tafIVGroup.classList.toggle('show', isIV);
    tafIVSel.required = isIV;
  }
  function updateEAD(){
    const showEAD = concluiuSel.checked;
    eadGroup.classList.toggle('show', showEAD);
    form.querySelector('[name="notaEAD"]').disabled          = !showEAD;
    form.querySelector('[name="dataConclusaoEAD"]').disabled = !showEAD;
    wrapInserido.classList.toggle('checked', inseridoSel.checked);
    wrapConcluiu.classList.toggle('checked', concluiuSel.checked);
  }

  tafSel.addEventListener('change', updateTafIV);

  inseridoSel.addEventListener('change', () => {
    if (!inseridoSel.checked) concluiuSel.checked = false;
    updateEAD();
  });
  concluiuSel.addEventListener('change', () => {
    if (concluiuSel.checked) inseridoSel.checked = true;
    updateEAD();
  });

  updateTafIV(); updateEAD();

  let autoFillTimeout;
  reInput.addEventListener('input', async () => {
    clearTimeout(autoFillTimeout);
    autoFillTimeout = setTimeout(async () => {
      const re = reInput.value.trim();
      autoFillBadge.classList.remove('show', 'warn', 'info');
      if (re.length !== 6) return;

      let found = null;
      let origem = '';

      if (sb){
        try {
          const { data, error } = await sb
            .from('policiais')
            .select('*')
            .eq('re', re)
            .maybeSingle();
          if (!error && data){
            found = {
              re:               data.re,
              dg:               data.dg,
              postoGrad:        data.posto_grad,
              nome:             data.nome,
              ciaSecao:         data.cia_secao        || '',
              dataNascimento:   data.data_nascimento  || '',
              dataExameOdonto:  data.ias_odonto       || '',
              dataExameMedico:  data.ias_medico       || '',
              validadeIAS:      data.validade_ias     || ''
            };
            origem = 'supabase';
          }
        } catch(e){
          console.warn('Falha ao consultar Supabase:', e);
        }
      }

      if (!found){
        const localFound = db.officers.find(x => x.re === re && (!officer || x.id !== officer.id));
        if (localFound){
          found = localFound;
          origem = 'local';
        }
      }

      if (!found) return;

      const setVal = (name, val) => {
        const el = form.elements[name];
        if (el) el.value = val || '';
      };
      setVal('dg',              found.dg);
      setVal('nome',            found.nome);
      setVal('ciaSecao',        found.ciaSecao || form.elements.ciaSecao.value);
      setVal('postoGrad',       found.postoGrad);
      setVal('dataNascimento',  found.dataNascimento);
      setVal('dataExameMedico', found.dataExameMedico);
      setVal('dataExameOdonto', found.dataExameOdonto);
      setVal('validadeIAS',     found.validadeIAS);

      if (found.categoria){
        catSel.value = found.categoria;
        refreshTurmas();
        turmaSel.value = found.turmaId || '';
      }

      if (found.taf){
        form.elements.taf.value = found.taf;
        if (found.taf === 'IV') form.elements.tafIVTipo.value = found.tafIVTipo || '';
        else                    form.elements.tafIVTipo.value = '';
      }

      if (origem === 'local'){
        inseridoSel.checked = (found.inseridoEAD === 'Sim');
        concluiuSel.checked = (found.concluiuEAD === 'Sim');
        if (concluiuSel.checked){
          form.elements.notaEAD.value          = found.notaEAD || '';
          form.elements.dataConclusaoEAD.value = found.dataConclusaoEAD || '';
        } else {
          form.elements.notaEAD.value          = '';
          form.elements.dataConclusaoEAD.value = '';
        }
      }

      updateTafIV(); updateEAD();

      if (origem === 'supabase'){
        autoFillText.textContent = 'Dados carregados da base central (Supabase)';
        autoFillBadge.classList.add('show');
      } else {
        autoFillText.textContent = 'Dados carregados do cache local';
        autoFillBadge.classList.add('show', 'warn');
      }
    }, 350);
  });

  document.getElementById('save-officer').addEventListener('click', async () => {
    if (!form.reportValidity()) return;
    const data = Object.fromEntries(new FormData(form).entries());

    data.inseridoEAD = inseridoSel.checked ? 'Sim' : 'Não';
    data.concluiuEAD = concluiuSel.checked ? 'Sim' : 'Não';

    if (data.taf !== 'IV') data.tafIVTipo = '';
    if (data.concluiuEAD !== 'Sim'){ data.notaEAD=''; data.dataConclusaoEAD=''; }
    if (data.inseridoEAD !== 'Sim'){ data.concluiuEAD='Não'; data.notaEAD=''; data.dataConclusaoEAD=''; }

    let enviadoSupabase = false;
    if (sb){
      try {
        const { error } = await sb.rpc('importar_policial', {
          p_re:              data.re,
          p_dg:              data.dg,
          p_posto_grad:      data.postoGrad,
          p_nome:            data.nome,
          p_su:              null,
          p_cia_secao:       data.ciaSecao         || null,
          p_data_nascimento: data.dataNascimento   || null,
          p_ias_odonto:      data.dataExameOdonto  || null,
          p_ias_medico:      data.dataExameMedico  || null,
          p_validade_ias:    data.validadeIAS      || null
        });
        if (!error) enviadoSupabase = true;
        else console.warn('RPC Supabase falhou:', error);
      } catch(e){
        console.warn('Falha ao enviar para Supabase:', e);
      }
    }

    if (isEdit){
      Object.assign(officer, data);
      toast('Policial atualizado.' + (enviadoSupabase ? ' Base central sincronizada.' : ''), 'success');
    } else {
      const existing = db.officers.find(x => x.re === data.re);
      if (existing){
        Object.assign(existing, data);
        toast('Policial atualizado (RE já cadastrado).' + (enviadoSupabase ? ' Base central sincronizada.' : ''), 'success');
      } else {
        data.id = uid();
        db.officers.push(data);
        toast('Policial adicionado.' + (enviadoSupabase ? ' Base central sincronizada.' : ''), 'success');
      }
    }
    saveDB(); render(); close();
  });
}

function openTurmaModal(turma = null){
  const isEdit = !!turma;
  const categoria = isEdit
    ? turma.categoria
    : (state.activeCategory === 'efetivo' ? 'cb_sd' : state.activeCategory);
  const proximaNum = isEdit ? turma.numero : proximaNumeracaoTurma(categoria);

  const t = turma || {
    categoria,
    numero: proximaNum,
    dataInicio: '',
    dataFim: '',
    observacoes: ''
  };

  const catOptions = REAL_CATEGORIES.map(c =>
    `<option value="${c.id}" ${c.id===t.categoria?'selected':''}>${c.label}</option>`
  ).join('');

  const body = `
    <form id="turma-form">
      <div class="form-grid">
        <div class="field col-6">
          <label>Categoria <span class="req">*</span></label>
          <select name="categoria" required ${isEdit?'disabled':''}>${catOptions}</select>
        </div>
        <div class="field col-6">
          <label>Identificação da Turma <span class="req">*</span></label>
          <input name="numero" required value="${escapeHTML(t.numero)}" placeholder="Ex.: I, II, III, IC...">
          ${!isEdit ? `
            <div class="auto-number-badge" id="auto-num-badge">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
              Sugestão automática: <strong style="margin-left:3px">${escapeHTML(proximaNum)}</strong>
            </div>
          ` : ''}
          <span class="hint">Numeração romana (I, II, III...) — pode ser alterada livremente.</span>
        </div>
        <div class="field col-6">
          <label>Data de Início <span class="req">*</span></label>
          <input type="date" name="dataInicio" id="dataInicio" required value="${t.dataInicio||''}">
        </div>
        <div class="field col-6">
          <label>Data de Término</label>
          <input type="date" name="dataFim" id="dataFim" value="${t.dataFim||''}" readonly>
          <span class="hint">Preenchida automaticamente — duração de 3 dias.</span>
        </div>
        <div class="field col-12">
          <label>Observações da Turma</label>
          <textarea name="observacoes" rows="4" placeholder="Informações gerais, local de instrução, instrutores, contatos, pendências...">${escapeHTML(t.observacoes||'')}</textarea>
          <span class="hint">Campo de texto livre — aparece no topo do card da turma.</span>
        </div>
      </div>
    </form>
  `;

  const footer = `
    <button class="btn btn-outline" data-close>Cancelar</button>
    <button class="btn btn-primary" id="save-turma">${isEdit?'Salvar Alterações':'Criar Turma'}</button>
  `;

  const { close } = openModal({
    title: isEdit ? `Editar Turma ${turma.numero}` : `Nova Turma — ${(CATEGORIES.find(c=>c.id===categoria)||{}).label || ''}`,
    bodyHTML: body, footerHTML: footer, size: 'sm'
  });

  const form   = document.getElementById('turma-form');
  const inicio = document.getElementById('dataInicio');
  const fim    = document.getElementById('dataFim');
  const numInput = form.querySelector('[name="numero"]');
  const autoBadge = document.getElementById('auto-num-badge');

  const catSel = form.querySelector('[name="categoria"]');
  if (!isEdit){
    catSel.addEventListener('change', () => {
      const nova = proximaNumeracaoTurma(catSel.value);
      numInput.value = nova;
      if (autoBadge){
        autoBadge.innerHTML = `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
          Sugestão automática: <strong style="margin-left:3px">${escapeHTML(nova)}</strong>
        `;
      }
    });
    numInput.addEventListener('input', () => {
      if (autoBadge) autoBadge.style.display = 'none';
    });
  }

  inicio.addEventListener('change', () => {
    fim.value = inicio.value ? addDays(inicio.value, 2) : '';
  });
  if (inicio.value) fim.value = addDays(inicio.value, 2);

  document.getElementById('save-turma').addEventListener('click', () => {
    if (!form.reportValidity()) return;
    const fd = new FormData(form);
    const data = {
      categoria:  isEdit ? turma.categoria : fd.get('categoria'),
      numero:     fd.get('numero').trim(),
      dataInicio: fd.get('dataInicio'),
      dataFim:    fd.get('dataFim') || addDays(fd.get('dataInicio'), 2),
      observacoes: (fd.get('observacoes') || '').trim()
    };
    if (isEdit){
      Object.assign(turma, data);
      toast('Turma atualizada.', 'success');
    } else {
      data.id = uid();
      data.concluida = false;
      db.turmas.push(data);
      toast(`Turma ${data.numero} criada com sucesso.`, 'success');
    }
    saveDB(); render(); close();
  });
}

/* ============================================================
   IMPORTAÇÃO
   ============================================================ */
function importBase(){
  const input = document.createElement('input');
  input.type    = 'file';
  input.accept  = '.xlsx,.xls,.csv,.txt,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv,text/plain';
  input.style.position = 'fixed';
  input.style.left     = '-9999px';
  input.style.opacity  = '0';
  document.body.appendChild(input);

  const cleanup = () => { try { input.remove(); } catch(e){} };

  input.addEventListener('change', e => {
    const file = e.target.files && e.target.files[0];
    if (!file){ cleanup(); return; }

    const ext = (file.name.split('.').pop() || '').toLowerCase();

    if (ext === 'xlsx' || ext === 'xls'){
      if (typeof XLSX === 'undefined'){
        toast('Biblioteca de Excel não carregada.', 'error');
        cleanup();
        return;
      }
      const reader = new FileReader();
      reader.onerror = () => { toast('Falha ao ler o arquivo.', 'error'); cleanup(); };
      reader.onload = ev => {
        try {
          const data  = new Uint8Array(ev.target.result);
          const wb    = XLSX.read(data, { type:'array', cellDates:true });
          const ws    = wb.Sheets[wb.SheetNames[0]];
          const rows  = XLSX.utils.sheet_to_json(ws, { header:1, raw:true, defval:'' });
          handleParsedRows(rows);
        } catch(err){
          console.error(err);
          toast('Erro ao interpretar Excel: ' + err.message, 'error');
        }
        cleanup();
      };
      reader.readAsArrayBuffer(file);
      return;
    }

    const reader = new FileReader();
    reader.onerror = () => { toast('Falha ao ler o arquivo.', 'error'); cleanup(); };
    reader.onload = ev => {
      try {
        const text = ev.target.result.replace(/^\uFEFF/, '');
        const rows = parseCSV(text);
        handleParsedRows(rows);
      } catch(err){
        console.error(err);
        toast('Erro ao processar arquivo: ' + err.message, 'error');
      }
      cleanup();
    };
    reader.readAsText(file, 'UTF-8');
  });

  input.click();
}

function handleParsedRows(rows){
  if (!rows || rows.length < 2){
    toast('Arquivo vazio ou sem dados.', 'error');
    return;
  }

  while (rows.length && (!rows[0] || rows[0].every(c => c == null || String(c).trim() === ''))) rows.shift();
  if (rows.length && rows[0].length === 1 && /^sep=/i.test(String(rows[0][0] || '').trim())){
    rows.shift();
    while (rows.length && (!rows[0] || rows[0].every(c => c == null || String(c).trim() === ''))) rows.shift();
  }
  if (rows.length < 2){ toast('Arquivo vazio ou sem dados.', 'error'); return; }

  const KNOWN = new Set(['re','postoGrad','nome','dg','su','taf','ciaSecao',
    'dataNascimento','dataExameMedico','dataExameOdonto','validadeIAS',
    'inseridoEAD','concluiuEAD','notaEAD','dataConclusaoEAD','tafIVTipo',
    'categoria','turma']);

  const SCAN = Math.min(6, rows.length - 1);
  let headerRowIdx = 0, bestScore = -1;
  for (let i = 0; i < SCAN; i++){
    const score = (rows[i] || []).reduce((acc, h) => {
      const k = normalizeHeader(h);
      return acc + (k && KNOWN.has(k) ? 1 : 0);
    }, 0);
    if (score > bestScore){ bestScore = score; headerRowIdx = i; }
  }

  const rawHeaders = (rows[headerRowIdx] || []).map(h => String(h == null ? '' : h).trim());
  const dataRows   = rows.slice(headerRowIdx + 1);

  const map = {};
  rawHeaders.forEach((h, i) => {
    const key = normalizeHeader(h);
    if (key && map[key] === undefined) map[key] = i;
  });

  if (map.re === undefined){
    const detected = rawHeaders.filter(Boolean).slice(0, 15).join(' | ') || '(nenhum)';
    toast('Coluna "RE" não encontrada. Cabeçalhos detectados: ' + detected, 'error');
    return;
  }
  if (dataRows.length === 0){
    toast('Nenhum registro encontrado abaixo do cabeçalho.', 'error');
    return;
  }

  /* Importação automática — sempre para o Efetivo 3º B.C., sem turma */
  processImport(dataRows, map, { categoria: null, turmaId: '', atualizar: true });
}

/* ============================================================
   PROCESSAMENTO DA IMPORTAÇÃO
   ============================================================ */
async function processImport(rows, map, defaults){
  let enviados = 0, atualizadosLocal = 0, novosLocal = 0, ignorados = 0, erros = 0;

  const total = rows.length;
  const usarSupabase = !!sb;
  showImportOverlay(`Enviando ${total} registro(s)${usarSupabase ? ' para o Supabase' : ' (modo local)'}...`);

  function inferirCategoria(postoGrad){
    if (!postoGrad) return 'cb_sd';
    const s = String(postoGrad).toUpperCase();
    if (/(CEL|MAJ|CAP|TEN)\s*PM/.test(s) && !/SUB/.test(s)) return 'oficiais';
    if (/(SUB|SGT)/.test(s)) return 'subten_sgt';
    return 'cb_sd';
  }

  const registros = [];
  rows.forEach(r => {
    if (!r || r.length === 0) return;

    const get = k => {
      if (map[k] === undefined) return '';
      let v = r[map[k]];
      if (v instanceof Date && !isNaN(v)){
        const y = v.getFullYear();
        const m = String(v.getMonth()+1).padStart(2,'0');
        const d = String(v.getDate()).padStart(2,'0');
        return `${y}-${m}-${d}`;
      }
      if (typeof v === 'boolean') return v ? 'Sim' : 'Não';
      return String(v ?? '').trim();
    };

    const re = get('re');
    if (!re){ ignorados++; return; }

    const postoGrad = get('postoGrad');
    const categoria = inferirCategoria(postoGrad);

    registros.push({
      re,
      dg:              get('dg'),
      postoGrad,
      nome:            get('nome'),
      ciaSecao:        get('ciaSecao'),
      su:              get('su'),
      dataNascimento:  normalizeDate(get('dataNascimento')),
      dataExameOdonto: normalizeDate(get('dataExameOdonto')),
      dataExameMedico: normalizeDate(get('dataExameMedico')),
      validadeIAS:     normalizeDate(get('validadeIAS')),
      categoria,
      turmaId:         ''
    });
  });

  if (usarSupabase){
    const LOTE = 20;
    for (let i = 0; i < registros.length; i += LOTE){
      const lote = registros.slice(i, i + LOTE);
      await Promise.all(lote.map(async reg => {
        try {
          const { data, error } = await sb.rpc('importar_policial', {
            p_re:              reg.re,
            p_dg:              reg.dg,
            p_posto_grad:      reg.postoGrad,
            p_nome:            reg.nome,
            p_su:              reg.su || null,
            p_cia_secao:       reg.ciaSecao || null,
            p_data_nascimento: reg.dataNascimento  || null,
            p_ias_odonto:      reg.dataExameOdonto || null,
            p_ias_medico:      reg.dataExameMedico || null,
            p_validade_ias:    reg.validadeIAS     || null
          });
          if (error) throw error;
          if (data && data.ok === false){
            console.warn('Supabase rejeitou RE', reg.re, data.erro);
            erros++;
          } else {
            enviados++;
          }
        } catch(err){
          console.error('Falha ao enviar RE', reg.re, err);
          erros++;
        }
      }));
    }
  }

  registros.forEach(reg => {
    const existing = db.officers.find(x => x.re === reg.re);
    const base = {
      re:              reg.re,
      dg:              reg.dg,
      postoGrad:       reg.postoGrad,
      nome:            reg.nome,
      ciaSecao:        reg.ciaSecao,
      dataNascimento:  reg.dataNascimento,
      dataExameOdonto: reg.dataExameOdonto,
      dataExameMedico: reg.dataExameMedico,
      validadeIAS:     reg.validadeIAS,
      categoria:       reg.categoria,
      turmaId:         '',
      taf:             'III',
      tafIVTipo:       '',
      inseridoEAD:     'Não',
      concluiuEAD:     'Não',
      notaEAD:         '',
      dataConclusaoEAD:''
    };

    if (existing){
      Object.assign(existing, {
        re:              base.re,
        dg:              base.dg,
        postoGrad:       base.postoGrad,
        nome:            base.nome,
        ciaSecao:        base.ciaSecao || existing.ciaSecao,
        dataNascimento:  base.dataNascimento || existing.dataNascimento,
        dataExameOdonto: base.dataExameOdonto || existing.dataExameOdonto,
        dataExameMedico: base.dataExameMedico || existing.dataExameMedico,
        validadeIAS:     base.validadeIAS    || existing.validadeIAS,
        categoria:       existing.categoria || base.categoria
      });
      atualizadosLocal++;
    } else {
      db.officers.push({ id: uid(), ...base });
      novosLocal++;
    }
  });

  saveDB();
  render();
  hideImportOverlay();

  const partes = [
    usarSupabase ? `${enviados} enviado(s) ao Supabase` : null,
    `${novosLocal} novo(s) local`,
    atualizadosLocal ? `${atualizadosLocal} atualizado(s) local` : null,
    erros ? `${erros} erro(s) Supabase` : null,
    ignorados ? `${ignorados} ignorado(s)` : null
  ].filter(Boolean).join(' • ');

  toast(`Importação concluída: ${partes}.`, erros ? 'error' : 'success');

  setActiveTab('efetivo');
  render();
}

function showImportOverlay(msg){
  const el = document.createElement('div');
  el.className = 'imp-overlay';
  el.id = 'imp-overlay';
  el.innerHTML = `
    <div class="imp-spinner"></div>
    <p>${escapeHTML(msg)}</p>
    <small>Aguarde, enviando e sincronizando dados...</small>
  `;
  document.body.appendChild(el);
}
function hideImportOverlay(){
  const el = document.getElementById('imp-overlay');
  if (el) el.remove();
}

/* ============================================================
   EXPORTAR TURMA EM EXCEL (.xlsx)
   ------------------------------------------------------------
   Colunas exportadas (conforme solicitado):
   Posto/Grad, RE, DG, Nome, TAF, Restrição (TAF IV),
   Cia/Seção, Nascimento, Validade IAS e Nota EAD
   ============================================================ */
function exportTurma(turmaId){
  /* Turmas virtuais do Efetivo 3º B.C. */
  if (String(turmaId).startsWith('__efetivo_')){
    const catId = turmaId.replace('__efetivo_', '');
    const catLabel = catId === 'outros'
      ? 'Não classificados'
      : ((CATEGORIES.find(c => c.id === catId) || {}).label || catId);
    const officers = catId === 'outros'
      ? db.officers.filter(o => !REAL_CATEGORIES.find(c => c.id === o.categoria))
      : db.officers.filter(o => o.categoria === catId);
    if (officers.length === 0){
      toast('Nenhum policial para exportar.', 'error');
      return;
    }
    exportOfficersList(
      officers,
      `Efetivo 3º B.C. — ${catLabel}`,
      `EAP2027_Efetivo3BC_${catLabel.replace(/[^\w]+/g,'-')}_${todayStamp()}.xlsx`
    );
    return;
  }

  const turma = db.turmas.find(t => t.id === turmaId);
  if (!turma) return;

  const officers = db.officers.filter(o => o.turmaId === turmaId);
  if (officers.length === 0){
    toast('Esta turma não possui policiais para exportar.', 'error');
    return;
  }

  const catLabel = (CATEGORIES.find(c => c.id === turma.categoria) || {}).label || turma.categoria;
  const nomeTurma = String(turma.numero || 'sem-numero').replace(/[^\w\-]+/g,'_');
  const filename = `EAP2027_${catLabel.replace(/[^\w]+/g,'-')}_Turma-${nomeTurma}_${todayStamp()}.xlsx`;

  exportOfficersList(officers, `Turma ${turma.numero}`, filename);
  toast(`Turma ${turma.numero}: ${officers.length} policiais exportados em Excel.`, 'success');
}

/* Lista enxuta de colunas — conforme solicitado pelo usuário */
function exportOfficersList(officers, sheetTitle, filename){
  const ordemPosto = {};
  POSTOS.forEach((p, i) => { ordemPosto[p] = i; });
  const ordenados = officers.slice().sort((a,b) => {
    const pa = ordemPosto[a.postoGrad] ?? 999;
    const pb = ordemPosto[b.postoGrad] ?? 999;
    if (pa !== pb) return pa - pb;
    return (a.nome||'').localeCompare(b.nome||'');
  });

  /* >>> Colunas solicitadas: <<< */
  const headers = [
    'Posto/Grad',
    'RE',
    'DG',
    'Nome',
    'TAF',
    'Restrição (TAF IV)',
    'Cia/Seção',
    'Nascimento',
    'Validade IAS',
    'Nota EAD',
  ];

  const rows = [headers];
  ordenados.forEach(o => {
    rows.push([
      o.postoGrad || '',
      o.re || '',
      o.dg || '',
      o.nome || '',
      o.taf || '',
      o.tafIVTipo || '',
      o.ciaSecao || '',
      o.dataNascimento ? fmtDate(o.dataNascimento) : '',
      o.validadeIAS    ? fmtDate(o.validadeIAS)    : '',
      o.notaEAD || ''
    ]);
  });

  const sheetName = String(sheetTitle).slice(0, 31);
  downloadXLSX([{ name: sheetName, rows }], filename);
}

    concluida ? 'success' : 'info'
  );
}
