/* ============================================================
   IMPORTAÇÃO
   ============================================================ */
function importBase(){
  const input = document.createElement('input');
  input.type    = 'file';
  input.accept  = '.xlsx,.xls,.csv,.txt,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv,text/plain';
  input.style.position = 'fixed';
  input.style.left     = '-9999px';
  input.style.opacity  = '0';
  document.body.appendChild(input);

  const cleanup = () => { try { input.remove(); } catch(e){} };

  input.addEventListener('change', e => {
    const file = e.target.files && e.target.files[0];
    if (!file){ cleanup(); return; }

    const ext = (file.name.split('.').pop() || '').toLowerCase();

    if (ext === 'xlsx' || ext === 'xls'){
      if (typeof XLSX === 'undefined'){
        toast('Biblioteca de Excel não carregada.', 'error');
        cleanup();
        return;
      }
      const reader = new FileReader();
      reader.onerror = () => { toast('Falha ao ler o arquivo.', 'error'); cleanup(); };
      reader.onload = ev => {
        try {
          const data  = new Uint8Array(ev.target.result);
          const wb    = XLSX.read(data, { type:'array', cellDates:true });
          const ws    = wb.Sheets[wb.SheetNames[0]];
          const rows  = XLSX.utils.sheet_to_json(ws, { header:1, raw:true, defval:'' });
          handleParsedRows(rows);
        } catch(err){
          console.error(err);
          toast('Erro ao interpretar Excel: ' + err.message, 'error');
        }
        cleanup();
      };
      reader.readAsArrayBuffer(file);
      return;
    }

    const reader = new FileReader();
    reader.onerror = () => { toast('Falha ao ler o arquivo.', 'error'); cleanup(); };
    reader.onload = ev => {
      try {
        const text = ev.target.result.replace(/^\uFEFF/, '');
        const rows = parseCSV(text);
        handleParsedRows(rows);
      } catch(err){
        console.error(err);
        toast('Erro ao processar arquivo: ' + err.message, 'error');
      }
      cleanup();
    };
    reader.readAsText(file, 'UTF-8');
  });

  input.click();
}

function handleParsedRows(rows){
  if (!rows || rows.length < 2){
    toast('Arquivo vazio ou sem dados.', 'error');
    return;
  }

  while (rows.length && (!rows[0] || rows[0].every(c => c == null || String(c).trim() === ''))) rows.shift();
  if (rows.length && rows[0].length === 1 && /^sep=/i.test(String(rows[0][0] || '').trim())){
    rows.shift();
    while (rows.length && (!rows[0] || rows[0].every(c => c == null || String(c).trim() === ''))) rows.shift();
  }
  if (rows.length < 2){ toast('Arquivo vazio ou sem dados.', 'error'); return; }

  const KNOWN = new Set(['re','postoGrad','nome','dg','su','taf','ciaSecao',
    'dataNascimento','dataExameMedico','dataExameOdonto','validadeIAS',
    'inseridoEAD','concluiuEAD','notaEAD','dataConclusaoEAD','tafIVTipo',
    'categoria','turma','ordemManual']);

  const SCAN = Math.min(6, rows.length - 1);
  let headerRowIdx = 0, bestScore = -1;
  for (let i = 0; i < SCAN; i++){
    const score = (rows[i] || []).reduce((acc, h) => {
      const k = normalizeHeader(h);
      return acc + (k && KNOWN.has(k) ? 1 : 0);
    }, 0);
    if (score > bestScore){ bestScore = score; headerRowIdx = i; }
  }

  const rawHeaders = (rows[headerRowIdx] || []).map(h => String(h == null ? '' : h).trim());
  const dataRows   = rows.slice(headerRowIdx + 1);

  const map = {};
  rawHeaders.forEach((h, i) => {
    const key = normalizeHeader(h);
    if (key && map[key] === undefined) map[key] = i;
  });

  if (map.re === undefined){
    const detected = rawHeaders.filter(Boolean).slice(0, 15).join(' | ') || '(nenhum)';
    toast('Coluna "RE" não encontrada. Cabeçalhos detectados: ' + detected, 'error');
    return;
  }
  if (dataRows.length === 0){
    toast('Nenhum registro encontrado abaixo do cabeçalho.', 'error');
    return;
  }

  processImport(dataRows, map);
}

/* ============================================================
   PROCESSAMENTO DA IMPORTAÇÃO
   ============================================================ */
async function processImport(rows, map){
  let enviados = 0, atualizadosLocal = 0, novosLocal = 0, ignorados = 0, erros = 0;

  const total = rows.length;
  const usarSupabase = !!sb;
  showImportOverlay(`Enviando ${total} registro(s)${usarSupabase ? ' para o Supabase' : ' (modo local)'}...`);

  function inferirCategoria(postoGrad){
    if (!postoGrad) return 'cb_sd';
    const s = String(postoGrad).toUpperCase();
    if (/(CEL|MAJ|CAP|TEN)\s*PM/.test(s) && !/SUB/.test(s)) return 'oficiais';
    if (/(SUB|SGT)/.test(s)) return 'subten_sgt';
    return 'cb_sd';
  }

  const registros = [];
  rows.forEach(r => {
    if (!r || r.length === 0) return;

    const get = k => {
      if (map[k] === undefined) return '';
      let v = r[map[k]];
      if (v instanceof Date && !isNaN(v)){
        const y = v.getFullYear();
        const m = String(v.getMonth()+1).padStart(2,'0');
        const d = String(v.getDate()).padStart(2,'0');
        return `${y}-${m}-${d}`;
      }
      if (typeof v === 'boolean') return v ? 'Sim' : 'Não';
      return String(v ?? '').trim();
    };

    const re = get('re');
    if (!re){ ignorados++; return; }

    const postoGrad = get('postoGrad');
    const categoria = inferirCategoria(postoGrad);

    registros.push({
      re,
      dg:              get('dg'),
      postoGrad,
      nome:            get('nome'),
      ciaSecao:        get('ciaSecao'),
      su:              get('su'),
      dataNascimento:  normalizeDate(get('dataNascimento')),
      dataExameOdonto: normalizeDate(get('dataExameOdonto')),
      dataExameMedico: normalizeDate(get('dataExameMedico')),
      validadeIAS:     normalizeDate(get('validadeIAS')),
      categoria,
      turmaId:         ''
    });
  });

  if (usarSupabase){
    const LOTE = 20;
    for (let i = 0; i < registros.length; i += LOTE){
      const lote = registros.slice(i, i + LOTE);
      await Promise.all(lote.map(async reg => {
        try {
          const { data, error } = await sb.rpc('importar_policial', {
            p_re:              reg.re,
            p_dg:              reg.dg,
            p_posto_grad:      reg.postoGrad,
            p_nome:            reg.nome,
            p_su:              reg.su || null,
            p_cia_secao:       reg.ciaSecao || null,
            p_data_nascimento: reg.dataNascimento  || null,
            p_ias_odonto:      reg.dataExameOdonto || null,
            p_ias_medico:      reg.dataExameMedico || null,
            p_validade_ias:    reg.validadeIAS     || null
          });
          if (error) throw error;
          if (data && data.ok === false){
            console.warn('Supabase rejeitou RE', reg.re, data.erro);
            erros++;
          } else {
            enviados++;
          }
        } catch(err){
          console.error('Falha ao enviar RE', reg.re, err);
          erros++;
        }
      }));
    }
  }

  registros.forEach(reg => {
    const existing = db.officers.find(x => x.re === reg.re);
    const base = {
      re:              reg.re,
      dg:              reg.dg,
      postoGrad:       reg.postoGrad,
      nome:            reg.nome,
      ciaSecao:        reg.ciaSecao,
      dataNascimento:  reg.dataNascimento,
      dataExameOdonto: reg.dataExameOdonto,
      dataExameMedico: reg.dataExameMedico,
      validadeIAS:     reg.validadeIAS,
      categoria:       reg.categoria,
      turmaId:         '',
      taf:             'III',
      tafIVTipo:       '',
      inseridoEAD:     'Não',
      concluiuEAD:     'Não',
      notaEAD:         '',
      dataConclusaoEAD:''
    };

    if (existing){
      Object.assign(existing, {
        re:              base.re,
        dg:              base.dg,
        postoGrad:       base.postoGrad,
        nome:            base.nome,
        ciaSecao:        base.ciaSecao || existing.ciaSecao,
        dataNascimento:  base.dataNascimento || existing.dataNascimento,
        dataExameOdonto: base.dataExameOdonto || existing.dataExameOdonto,
        dataExameMedico: base.dataExameMedico || existing.dataExameMedico,
        validadeIAS:     base.validadeIAS    || existing.validadeIAS,
        categoria:       existing.categoria || base.categoria
      });
      atualizadosLocal++;
    } else {
      db.officers.push({ id: uid(), ...base });
      novosLocal++;
    }
  });

  saveDB();
  render();
  hideImportOverlay();

  const partes = [
    usarSupabase ? `${enviados} enviado(s) ao Supabase` : null,
    `${novosLocal} novo(s) local`,
    atualizadosLocal ? `${atualizadosLocal} atualizado(s) local` : null,
    erros ? `${erros} erro(s) Supabase` : null,
    ignorados ? `${ignorados} ignorado(s)` : null
  ].filter(Boolean).join(' • ');

  toast(`Importação concluída: ${partes}.`, erros ? 'error' : 'success');

  setActiveTab('efetivo');
  render();
}

/* ============================================================
   SINCRONIZAÇÃO COM SUPABASE
   ============================================================ */
async function sincronizarComSupabase({silencioso = false} = {}){
  if (!sb){
    if (!silencioso) toast('Supabase não configurado.', 'error');
    return false;
  }

  const btn = document.getElementById('btn-sync');
  if (btn) btn.classList.add('spinning');

  setConnStatus('syncing', 'Sincronizando...');
  console.log('[sync] início');

  const timeout = new Promise((_, reject) =>
    setTimeout(() => reject(new Error('Timeout: Supabase não respondeu em 15s')), 15000)
  );

  try {
    const tarefa = (async () => {
      const PAGE = 1000;
      let from = 0;
      let todos = [];
      while (true){
        console.log(`[sync] consultando range ${from}-${from + PAGE - 1}`);
        const { data, error } = await sb
          .from('policiais')
          .select('re,dg,posto_grad,nome,cia_secao,data_nascimento,ias_odonto,ias_medico,validade_ias,ordem_manual')
          .range(from, from + PAGE - 1);
        if (error){
          console.error('[sync] erro do Supabase:', error);
          throw error;
        }
        if (!data || data.length === 0) break;
        todos = todos.concat(data);
        if (data.length < PAGE) break;
        from += PAGE;
      }

      if (todos.length === 0){
        if (!silencioso) toast('A base central está vazia.', 'info');
        return true;
      }

      const nuvem = todos.map(d => ({
        re:              String(d.re || '').trim(),
        dg:              d.dg || '',
        postoGrad:       d.posto_grad || '',
        nome:            d.nome || '',
        ciaSecao:        d.cia_secao || '',
        dataNascimento:  d.data_nascimento || '',
        dataExameOdonto: d.ias_odonto      || '',
        dataExameMedico: d.ias_medico      || '',
        validadeIAS:     d.validade_ias    || '',
        ordemManual:     (typeof d.ordem_manual === 'number') ? d.ordem_manual : null
      })).filter(x => x.re);

      const porRE = new Map();
      db.officers.forEach(o => porRE.set(o.re, o));

      let atualizados = 0, novos = 0;

      const inferirCategoria = (postoGrad) => {
        if (!postoGrad) return 'cb_sd';
        const s = String(postoGrad).toUpperCase();
        if (/(CEL|MAJ|CAP|TEN)\s*PM/.test(s) && !/SUB/.test(s)) return 'oficiais';
        if (/(SUB|SGT)/.test(s)) return 'subten_sgt';
        return 'cb_sd';
      };

      nuvem.forEach(reg => {
        const existing = porRE.get(reg.re);
        if (existing){
          existing.dg              = reg.dg              || existing.dg;
          existing.postoGrad       = reg.postoGrad       || existing.postoGrad;
          existing.nome            = reg.nome            || existing.nome;
          existing.ciaSecao        = reg.ciaSecao        || existing.ciaSecao;
          existing.dataNascimento  = reg.dataNascimento  || existing.dataNascimento;
          existing.dataExameOdonto = reg.dataExameOdonto || existing.dataExameOdonto;
          existing.dataExameMedico = reg.dataExameMedico || existing.dataExameMedico;
          existing.validadeIAS     = reg.validadeIAS     || existing.validadeIAS;
          if (typeof reg.ordemManual === 'number') existing.ordemManual = reg.ordemManual;
          atualizados++;
        } else {
          db.officers.push({
            id:              uid(),
            re:              reg.re,
            dg:              reg.dg,
            postoGrad:       reg.postoGrad,
            nome:            reg.nome,
            ciaSecao:        reg.ciaSecao,
            dataNascimento:  reg.dataNascimento,
            dataExameOdonto: reg.dataExameOdonto,
            dataExameMedico: reg.dataExameMedico,
            validadeIAS:     reg.validadeIAS,
            categoria:       inferirCategoria(reg.postoGrad),
            turmaId:         '',
            taf:             'III',
            tafIVTipo:       '',
            inseridoEAD:     'Não',
            concluiuEAD:     'Não',
            notaEAD:         '',
            dataConclusaoEAD:'',
            ordemManual:     (typeof reg.ordemManual === 'number') ? reg.ordemManual : undefined
          });
          novos++;
        }
      });

      saveDB();
      render();

      if (!silencioso){
        toast(`Sincronização concluída: ${novos} novo(s), ${atualizados} atualizado(s).`, 'success');
      }
      return true;
    })();

    const resultado = await Promise.race([tarefa, timeout]);

    const el = document.getElementById('conn-status');
    if (el){
      el.textContent = 'Supabase Online';
      el.className = 'conn-status online';
      el.title = 'Sincronizado com a base central.';
    }
    console.log('[sync] fim (sucesso)');
    return resultado;

  } catch(err){
    console.error('[sync] falha:', err);
    const el = document.getElementById('conn-status');
    if (el){
      el.textContent = 'Supabase Offline';
      el.className = 'conn-status offline';
      el.title = 'Falha ao sincronizar: ' + (err.message || err);
    }
    if (!silencioso) toast('Falha ao sincronizar: ' + (err.message || err), 'error');
    return false;

  } finally {
    if (btn) btn.classList.remove('spinning');
    console.log('[sync] finally executado');
  }
}

/* ============================================================

   ============================================================ */
function exportTurma(turmaId){
  if (String(turmaId).startsWith('__efetivo_')){
    const catId = turmaId.replace('__efetivo_', '');
    const catLabel = catId === 'outros'
      ? 'Não classificados'
      : ((CATEGORIES.find(c => c.id === catId) || {}).label || catId);
    const officers = catId === 'outros'
      ? db.officers.filter(o => !REAL_CATEGORIES.find(c => c.id === o.categoria))
      : db.officers.filter(o => o.categoria === catId);
    if (officers.length === 0){
      toast('Nenhum policial para exportar.', 'error');
      return;
    }
    exportOfficersList(
      officers,
      `Efetivo 3º B.C. — ${catLabel}`,
      `EAP2027_Efetivo3BC_${catLabel.replace(/[^\w]+/g,'-')}_${todayStamp()}.xlsx`
    );
    return;
  }

  const turma = db.turmas.find(t => t.id === turmaId);
  if (!turma) return;

  const officers = db.officers.filter(o => o.turmaId === turmaId);
  if (officers.length === 0){
    toast('Esta turma não possui policiais para exportar.', 'error');
    return;
  }

  const catLabel = (CATEGORIES.find(c => c.id === turma.categoria) || {}).label || turma.categoria;
  const nomeTurma = String(turma.numero || 'sem-numero').replace(/[^\w\-]+/g,'_');
  const filename = `EAP2027_${catLabel.replace(/[^\w]+/g,'-')}_Turma-${nomeTurma}_${todayStamp()}.xlsx`;

  exportOfficersList(officers, `Turma ${turma.numero}`, filename);
  toast(`Turma ${turma.numero}: ${officers.length} policiais exportados em Excel.`, 'success');
}

function exportOfficersList(officers, sheetTitle, filename){
  const ordenados = officers.slice().sort(sortOfficersManual);

  const headers = [
    'Posto/Grad',
    'RE',
    'DG',
    'Nome',
    'TAF',
    'Restrição (TAF IV)',
    'Cia/Seção',
    'Nascimento',
    'Validade IAS',
    'Nota EAD',
    'Observações'
  ];

  const rows = [headers];
  ordenados.forEach(o => {
    let observacao = '';
    if (o.taf === 'IV') {
      if (o.tafIVTipo === 'Lesão Membros Inferiores' ||
          o.tafIVTipo === 'Lesão Membros Superiores' ||
          o.tafIVTipo === 'Coluna Vertebral') {
        observacao = 'Regularização de TAF IV e TAT';
      } else if (o.tafIVTipo === 'Cardíaco') {
        observacao = 'Regularização de TAT';
      }
    }

    rows.push([
      o.postoGrad || '',
      o.re || '',
      o.dg || '',
      o.nome || '',
      o.taf || '',
      o.tafIVTipo || '',
      o.ciaSecao || '',
      o.dataNascimento ? fmtDate(o.dataNascimento) : '',
      o.validadeIAS    ? fmtDate(o.validadeIAS)    : '',
      o.notaEAD || '',
      observacao
    ]);
  });

  const sheetName = String(sheetTitle).slice(0, 31);
  downloadXLSX([{ name: sheetName, rows }], filename);
}

/* ============================================================
   EXTRAIR EXCEL — múltiplas categorias (via menu lateral)
   ============================================================ */
function buildExportRows(officers){
  const headers = [
    'Posto/Grad','RE','DG','Nome','TAF','Restrição (TAF IV)',
    'Cia/Seção','Nascimento','Validade IAS','Nota EAD','Observações'
  ];
  const rows = [headers];
  officers.forEach(o => {
    let observacao = '';
    if (o.taf === 'IV'){
      if (o.tafIVTipo === 'Lesão Membros Inferiores' ||
          o.tafIVTipo === 'Lesão Membros Superiores' ||
          o.tafIVTipo === 'Coluna Vertebral'){
        observacao = 'Regularização de TAF IV e TAT';
      } else if (o.tafIVTipo === 'Cardíaco'){
        observacao = 'Regularização de TAT';
      }
    }
    rows.push([
      o.postoGrad || '',
      o.re || '',
      o.dg || '',
      o.nome || '',
      o.taf || '',
      o.tafIVTipo || '',
      o.ciaSecao || '',
      o.dataNascimento ? fmtDate(o.dataNascimento) : '',
      o.validadeIAS    ? fmtDate(o.validadeIAS)    : '',
      o.notaEAD || '',
      observacao
    ]);
  });
  return rows;
}

function exportMultiCategory(){
  const selected = Array.from(
    document.querySelectorAll('.side-check input[type="checkbox"]:checked')
  ).map(cb => cb.dataset.exportCat).filter(Boolean);

  if (selected.length === 0){
    toast('Selecione ao menos uma categoria para exportar.', 'error');
    return;
  }

  const sheets = [];
  const usedNames = new Set();

  function makeSheetName(raw){
    let base = String(raw || 'Planilha').replace(/[*?:\/\\\[\]]/g, '-').slice(0, 31).trim();
    if (!base) base = 'Planilha';
    let name = base;
    let i = 1;
    while (usedNames.has(name)){
      const suffix = `_${i++}`;
      name = base.slice(0, Math.max(1, 31 - suffix.length)) + suffix;
    }
    usedNames.add(name);
    return name;
  }

  let totalPoliciais = 0;

  selected.forEach(catId => {
    const catLabel = (CATEGORIES.find(c => c.id === catId) || {}).label || catId;
    const turmas = db.turmas.filter(t => t.categoria === catId).sort(sortTurmas);

    turmas.forEach(t => {
      const officers = db.officers
        .filter(o => o.turmaId === t.id)
        .sort(sortOfficersManual);
      if (officers.length === 0) return;

      sheets.push({
        name: makeSheetName(`${catLabel} - T${t.numero}`),
        rows: buildExportRows(officers)
      });
      totalPoliciais += officers.length;
    });

    // Policiais da categoria sem turma atribuída
    const semTurma = db.officers
      .filter(o => !o.turmaId && o.categoria === catId)
      .sort(sortOfficersManual);

    if (semTurma.length > 0){
      sheets.push({
        name: makeSheetName(`${catLabel} - Sem Turma`),
        rows: buildExportRows(semTurma)
      });
      totalPoliciais += semTurma.length;
    }
  });

  if (sheets.length === 0){
    toast('Nenhum policial encontrado nas categorias selecionadas.', 'error');
    return;
  }

  const filename = `EAP${currentYear}_Exportacao_${todayStamp()}.xlsx`;
  downloadXLSX(sheets, filename);
  toast(`${totalPoliciais} policial(is) exportado(s) em ${sheets.length} aba(s).`, 'success');
}

/* ============================================================
   MARCAR TURMA COMO CONCLUÍDA
   ============================================================ */
function toggleTurmaConcluida(turmaId, concluida){
  const turma = db.turmas.find(t => t.id === turmaId);
  if (!turma) return;
  turma.concluida = !!concluida;
  saveDB();
  render();
  toast(concluida
    ? `Turma ${turma.numero} marcada como CONCLUÍDA.`
    : `Turma ${turma.numero} reaberta.`,
    concluida ? 'success' : 'info'
  );
}

/* ============================================================
   BOOT — Autenticação e inicialização
   ============================================================ */
(function configurarAutenticacao(){
  const form      = document.getElementById('login-form');
  const btnLogin  = document.getElementById('login-btn');
  const btnLogout = document.getElementById('btn-logout');

  if (form){
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      limparErroLogin();

      const email = document.getElementById('login-email').value;
      const senha = document.getElementById('login-password').value;

      if (!email || !senha){
        mostrarErroLogin('Preencha e-mail e senha.');
        return;
      }

      if (btnLogin){
        btnLogin.classList.add('loading');
        btnLogin.disabled = true;
      }

      try {
        const data = await fazerLogin(email, senha);
        document.getElementById('login-password').value = '';
        await entrarNoApp(data.user);
      } catch(err){
        console.error('Erro no login:', err);
        mostrarErroLogin(traduzirErroAuth(err.message));
        document.getElementById('login-password').value = '';
      } finally {
        if (btnLogin){
          btnLogin.classList.remove('loading');
          btnLogin.disabled = false;
        }
      }
    });
  }

  if (btnLogout){
    btnLogout.addEventListener('click', async () => {
      if (!confirm('Deseja realmente sair do sistema?')) return;
      await fazerLogout();
      atualizarEmailHeader(null);
      mostrarLogin();
    });
  }
})();

/* ---------- Boot principal ---------- */
(async function boot(){
  if (!sb){
    console.warn('Supabase ausente — entrando em modo local sem login.');
    esconderLogin();
    await checarConexaoSupabase();
    render();
    return;
  }

  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_OUT'){
      atualizarEmailHeader(null);
      mostrarLogin();
    }
    if (event === 'SIGNED_IN' && session && session.user){
      atualizarEmailHeader(session.user);
    }
  });

  try {
    const { data } = await sb.auth.getSession();
    if (data && data.session && data.session.user){
      await entrarNoApp(data.session.user);
      return;
    }
  } catch(e){
    console.warn('Falha ao recuperar sessão:', e);
  }

  mostrarLogin();
})();
</script>
