<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EAP 2027 | Estágio de Atualização Profissional</title>
<style>
/* ============================================================
   1. TOKENS / VARIÁVEIS GLOBAIS
   ============================================================ */
:root{
  --navy-900:#0a1e33; --navy-800:#0f2942; --navy-700:#143a5c;
  --navy-600:#1d4d75; --gold-500:#c9a44a; --gold-400:#e0be6a;
  --g50:#f8fafc; --g100:#f1f5f9; --g200:#e2e8f0; --g300:#cbd5e1;
  --g400:#94a3b8; --g500:#64748b; --g600:#475569; --g700:#334155; --g900:#0f172a;
  --green:#16a34a; --green-l:#dcfce7; --red:#dc2626; --red-l:#fee2e2;
  --amber:#d97706; --amber-l:#fef3c7; --blue:#2563eb; --blue-l:#dbeafe;
  --shadow-sm:0 1px 3px rgba(15,23,42,.06), 0 1px 2px rgba(15,23,42,.04);
  --shadow:0 4px 12px rgba(15,23,42,.06), 0 2px 4px rgba(15,23,42,.04);
  --shadow-md:0 10px 22px -6px rgba(15,23,42,.12), 0 4px 8px -4px rgba(15,23,42,.06);
  --shadow-lg:0 24px 48px -12px rgba(15,23,42,.25), 0 12px 24px -10px rgba(15,23,42,.12);
  --radius:10px; --radius-lg:16px;

  --cat-cb-sd:#16a34a;      --cat-cb-sd-dark:#15803d;
  --cat-subten-sgt:#dc2626; --cat-subten-sgt-dark:#b91c1c;
  --cat-oficiais:#c9a44a;   --cat-oficiais-dark:#a8863a;
  --cat-efetivo:#2563eb;    --cat-efetivo-dark:#1d4ed8;

  /* Dimensões do quadrado dourado (turma) */
  --turma-num-size:46px;
  --turma-num-font:clamp(12px, 1.1vw, 16px);

  /* Largura do menu lateral */
  --sidebar-w:240px;
}

/* ============================================================
   2. RESET / BASE
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  background:linear-gradient(180deg,#f1f5f9 0%, #e8eef5 100%);
  color:var(--g900); line-height:1.5; font-size:14px;
  -webkit-font-smoothing:antialiased; min-height:100vh;
  overflow-x:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:inherit}
img{max-width:100%;height:auto;display:block}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(16px) scale(.98);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ============================================================
   3. COMPONENTES COMPARTILHADOS (desktop + mobile)
   ============================================================ */

/* ---- Botões base ---- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:9px 16px;border-radius:var(--radius);
  font-size:13px;font-weight:600;transition:all .18s ease;white-space:nowrap;
  box-shadow:0 1px 2px rgba(0,0,0,.05);min-width:0;
}
.btn svg{width:16px;height:16px;flex-shrink:0}
.btn-gold{background:linear-gradient(180deg,var(--gold-400),var(--gold-500));color:var(--navy-900);box-shadow:0 2px 6px rgba(201,164,74,.35)}
.btn-gold:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(201,164,74,.45)}
.btn-ghost{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(6px)}
.btn-ghost:hover{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.35)}
.btn-primary{background:linear-gradient(180deg,var(--navy-700),var(--navy-800));color:#fff}
.btn-primary:hover{background:linear-gradient(180deg,var(--navy-600),var(--navy-700));box-shadow:var(--shadow-md)}
.btn-outline{background:#fff;border:1px solid var(--g300);color:var(--g700)}
.btn-outline:hover{background:var(--g50);border-color:var(--navy-600);color:var(--navy-700)}
.btn-danger{background:linear-gradient(180deg,#ef4444,var(--red));color:#fff}
.btn-danger:hover{background:linear-gradient(180deg,#dc2626,#b91c1c);box-shadow:0 6px 14px rgba(220,38,38,.35)}
.btn-sm{padding:6px 12px;font-size:12px}

/* ---- Botão sincronizar ---- */
.btn-sync{
  background:linear-gradient(180deg,#3b82f6,#2563eb);
  border:2px solid #60a5fa;color:#fff;font-weight:700;
  padding:9px 16px;display:inline-flex;align-items:center;gap:8px;min-height:38px;
  box-shadow:0 2px 6px rgba(37,99,235,.35), inset 0 1px 0 rgba(255,255,255,.15);
  transition:all .18s ease;position:relative;overflow:hidden;
}
.btn-sync svg{width:16px;height:16px;flex-shrink:0;stroke-width:2.2}
.btn-sync .lbl{display:inline-block;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25);white-space:nowrap;line-height:1}
.btn-sync:hover{background:linear-gradient(180deg,#60a5fa,#3b82f6);border-color:#93c5fd;transform:translateY(-1px);box-shadow:0 6px 14px rgba(37,99,235,.5), inset 0 1px 0 rgba(255,255,255,.2)}
.btn-sync:active{transform:translateY(0);box-shadow:0 2px 4px rgba(37,99,235,.4), inset 0 1px 3px rgba(0,0,0,.2)}
.btn-sync:focus-visible{outline:2px solid #93c5fd;outline-offset:2px}
.btn-sync.spinning svg{animation:spin 1s linear infinite}
.btn-sync.spinning{pointer-events:none;opacity:.85}

/* ---- Status de conexão ---- */
.conn-status{
  display:inline-flex;align-items:center;gap:6px;padding:5px 10px;
  border-radius:20px;font-size:11px;font-weight:700;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.08);
  color:rgba(255,255,255,.85);
  white-space:nowrap;max-width:100%;
}
.conn-status::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--g500);flex-shrink:0}
.conn-status.online::before{background:#4ade80;box-shadow:0 0 8px #4ade80}
.conn-status.offline::before{background:#f87171;box-shadow:0 0 8px #f87171}
.conn-status.syncing::before{background:#60a5fa;box-shadow:0 0 8px #60a5fa;animation:pulse 1s ease infinite}

/* ---- Email do usuário ---- */
.user-email{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);
  color:rgba(255,255,255,.85);max-width:200px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;
}

/* ---- Botão logout ---- */
.btn-logout{
  background:linear-gradient(180deg,rgba(220,38,38,.35),rgba(220,38,38,.25));
  border:1px solid rgba(248,113,113,.55);color:#fff;
}
.btn-logout:hover{
  background:linear-gradient(180deg,rgba(220,38,38,.55),rgba(220,38,38,.4));
  transform:translateY(-1px);
}

/* ---- Pills ---- */
.pill{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.2px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.pill-green{background:var(--green-l);color:#15803d;border:1px solid rgba(22,163,74,.2)}
.pill-red{background:var(--red-l);color:#b91c1c;border:1px solid rgba(220,38,38,.2)}
.pill-amber{background:var(--amber-l);color:#b45309;border:1px solid rgba(217,119,6,.2)}
.pill-blue{background:var(--blue-l);color:#1d4ed8;border:1px solid rgba(37,99,235,.2)}
.pill-gray{background:var(--g200);color:var(--g700);border:1px solid rgba(100,116,139,.15)}

/* ---- Ações de linha (tabela) ---- */
.row-actions{display:flex;gap:4px;justify-content:flex-end}
.row-btn{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--g500);transition:all .15s;flex-shrink:0}
.row-btn:hover{background:var(--g100);color:var(--navy-700);transform:scale(1.06)}
.row-btn.danger:hover{background:var(--red-l);color:var(--red)}
.row-btn svg{width:14px;height:14px}

/* ---- Empty state ---- */
.empty-state{text-align:center;padding:60px 20px;color:var(--g500)}
.empty-state svg{width:64px;height:64px;opacity:.35;margin:0 auto 16px;color:var(--navy-600)}
.empty-state h3{color:var(--g700);font-size:16px;margin-bottom:8px;line-height:1.35}
.empty-state p{font-size:13px;max-width:440px;margin:0 auto;line-height:1.6;word-break:break-word}

/* ---- Observações da turma ---- */
.turma-obs{display:flex;gap:10px;padding:12px 20px;background:linear-gradient(180deg,#fffbeb,#fef9ec);border-bottom:1px solid #fcd34d;align-items:flex-start}
.turma-obs svg{width:16px;height:16px;color:var(--amber);flex-shrink:0;margin-top:2px}
.turma-obs-content{flex:1;min-width:0}
.turma-obs-label{font-size:10px;font-weight:800;color:#b45309;text-transform:uppercase;letter-spacing:.6px;margin-bottom:3px}
.turma-obs-text{font-size:13px;color:var(--g700);white-space:pre-wrap;line-height:1.5;word-break:break-word;overflow-wrap:anywhere}

/* ---- Checkbox wrap ---- */
.checkbox-wrap{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:44px;border:1.5px solid var(--g200);border-radius:var(--radius);background:#fff;cursor:pointer;font-size:13px;transition:all .18s;user-select:none}
.checkbox-wrap:hover{background:var(--g50);border-color:var(--g300)}
.checkbox-wrap input{width:18px;height:18px;cursor:pointer;flex-shrink:0;accent-color:var(--navy-700)}
.checkbox-wrap span{color:var(--g700);font-weight:600;line-height:1.3;word-break:break-word}
.checkbox-wrap.checked{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border-color:var(--green);box-shadow:0 0 0 3px rgba(22,163,74,.1)}
.checkbox-wrap.checked span{color:#065f46}

/* ============================================================
   CORREÇÃO — Checkbox dentro de formulário (.field)
   Neutraliza as regras genéricas de .field input / .field label
   que quebravam os checkboxes "Inserido no EAD?" e "Concluiu o EAD?"
   ============================================================ */
.field .checkbox-wrap{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;min-height:44px;width:100%;
  border:1.5px solid var(--g200);border-radius:var(--radius);
  background:#fff;
  font-size:13px;font-weight:600;color:var(--g700);
  text-transform:none;letter-spacing:normal;line-height:1.3;
  cursor:pointer;user-select:none;transition:all .18s ease;
}
.field .checkbox-wrap:hover{background:var(--g50);border-color:var(--g300)}

.field .checkbox-wrap input[type="checkbox"],
.field .checkbox-wrap input[type="checkbox"]:hover,
.field .checkbox-wrap input[type="checkbox"]:focus{
  width:18px;height:18px;min-width:18px;min-height:18px;
  flex:0 0 18px;
  margin:0;padding:0;
  border:none;border-radius:4px;
  background:transparent;box-shadow:none;
  accent-color:var(--navy-700);
  cursor:pointer;
  appearance:auto;-webkit-appearance:auto;
}
.field .checkbox-wrap input[type="checkbox"]:focus-visible{
  outline:2px solid var(--navy-600);outline-offset:2px;
}

.field .checkbox-wrap span{
  font-size:13px;font-weight:600;
  color:var(--g700);
  text-transform:none;letter-spacing:normal;line-height:1.3;
  word-break:break-word;
}

.field .checkbox-wrap.checked{
  background:linear-gradient(135deg,#ecfdf5,#d1fae5);
  border-color:var(--green);
  box-shadow:0 0 0 3px rgba(22,163,74,.1);
}
.field .checkbox-wrap.checked span{color:#065f46}

/* ---- RE auto-fill badge ---- */
.re-autofill{display:none;font-size:11px;color:var(--green);font-weight:700;align-items:center;gap:5px;margin-top:4px;padding:5px 9px;background:var(--green-l);border-radius:6px;width:fit-content;max-width:100%;line-height:1.3;word-break:break-word}
.re-autofill.show{display:flex;animation:slideUp .2s ease}
.re-autofill svg{width:12px;height:12px;flex-shrink:0}
.re-autofill.warn{color:#b45309;background:var(--amber-l)}
.re-autofill.info{color:#1d4ed8;background:var(--blue-l)}

/* ---- Auto-number badge ---- */
.auto-number-badge{display:inline-flex;align-items:center;gap:5px;margin-top:4px;font-size:11px;font-weight:700;color:#15803d;background:var(--green-l);padding:5px 9px;border-radius:6px;width:fit-content;max-width:100%;flex-wrap:wrap;line-height:1.3}
.auto-number-badge svg{width:12px;height:12px;flex-shrink:0}

/* ---- Section title (form) ---- */
.section-title{grid-column:span 12;font-size:12px;font-weight:800;color:var(--navy-700);text-transform:uppercase;letter-spacing:.8px;padding:6px 0 6px 12px;margin-top:8px;position:relative;line-height:1.35}
.section-title::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:3px;background:linear-gradient(180deg,var(--gold-500),var(--gold-400));border-radius:2px}

/* ---- Form grid base ---- */
.form-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.col-3{grid-column:span 3}
.field.col-4{grid-column:span 4}
.field.col-6{grid-column:span 6}
.field.col-8{grid-column:span 8}
.field.col-12{grid-column:span 12}
.field label{font-size:11px;font-weight:700;color:var(--g600);text-transform:uppercase;letter-spacing:.5px;line-height:1.35}
.field label .req{color:var(--red);font-weight:800}
.field input,.field select,.field textarea{padding:10px 13px;border:1.5px solid var(--g200);border-radius:var(--radius);font-size:13px;background:#fff;transition:all .18s;width:100%;color:var(--g900);min-width:0}
.field textarea{resize:vertical;min-height:88px;line-height:1.5;font-family:inherit}
.field input:hover,.field select:hover,.field textarea:hover{border-color:var(--g300)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--navy-600);background:#fff;box-shadow:0 0 0 4px rgba(20,58,92,.1)}
.field input:disabled,.field select:disabled{background:var(--g100);color:var(--g500);cursor:not-allowed}
.field .hint{font-size:11px;color:var(--g500);line-height:1.4;word-break:break-word}

/* ---- Conditional group ---- */
.conditional-group{display:none}
.conditional-group.show{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;grid-column:span 12;padding:16px;background:linear-gradient(135deg,#fffbeb,#fef3c7);border-radius:var(--radius);border:1px solid #fcd34d;animation:slideUp .2s ease}

/* ---- Toast ---- */
#toasts{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:10px;max-width:calc(100vw - 48px)}
.toast{background:linear-gradient(180deg,var(--g900),#1a2438);color:#fff;padding:14px 20px;border-radius:var(--radius);box-shadow:var(--shadow-lg);font-size:13px;font-weight:500;display:flex;align-items:center;gap:12px;animation:slideUp .25s cubic-bezier(.16,1,.3,1);min-width:280px;max-width:440px;border:1px solid rgba(255,255,255,.08);word-break:break-word}
.toast::before{content:'';width:8px;height:8px;border-radius:50%;flex-shrink:0}
.toast-success::before{background:var(--green);box-shadow:0 0 12px var(--green)}
.toast-error::before{background:var(--red);box-shadow:0 0 12px var(--red)}
.toast-info::before{background:var(--blue);box-shadow:0 0 12px var(--blue)}

/* ---- Import overlay ---- */
.imp-overlay{position:fixed;inset:0;background:rgba(10,30,51,.7);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:300;flex-direction:column;gap:18px;color:#fff;padding:20px;text-align:center}
.imp-spinner{width:56px;height:56px;border:4px solid rgba(255,255,255,.2);border-top-color:var(--gold-400);border-radius:50%;animation:spin 1s linear infinite;flex-shrink:0}
.imp-overlay p{font-size:15px;font-weight:600;letter-spacing:.3px;word-break:break-word}
.imp-overlay small{font-size:12px;color:rgba(255,255,255,.7);word-break:break-word}

/* ---- Login ---- */
#login-screen{
  position:fixed;inset:0;z-index:9999;
  background:linear-gradient(135deg,#081a2c 0%, var(--navy-800) 55%, var(--navy-700) 100%);
  display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto;
}
#login-screen.hidden{display:none}
.login-card{
  background:#fff;border-radius:var(--radius-lg);padding:36px 32px;
  box-shadow:var(--shadow-lg);width:100%;max-width:420px;
  animation:slideUp .3s cubic-bezier(.16,1,.3,1);
}
.login-card h2{font-size:20px;font-weight:800;color:var(--navy-800);margin-bottom:6px;text-align:center;line-height:1.3}
.login-card p.sub{font-size:13px;color:var(--g500);text-align:center;margin-bottom:26px;line-height:1.45}
.login-logo{
  width:64px;height:64px;border-radius:50%;margin:0 auto 18px;
  background:radial-gradient(circle at 30% 30%,var(--gold-400),var(--gold-500) 70%);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;color:var(--navy-900);font-size:18px;
  box-shadow:inset 0 -3px 6px rgba(0,0,0,.25),0 6px 18px rgba(201,164,74,.4);
  border:3px solid rgba(255,255,255,.6);overflow:hidden;
}
.login-logo img{width:100%;height:100%;object-fit:contain;border-radius:50%}
.login-field{margin-bottom:16px}
.login-field label{display:block;font-size:11px;font-weight:700;color:var(--g600);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;line-height:1.35}
.login-field input{width:100%;padding:12px 14px;border:1.5px solid var(--g200);border-radius:var(--radius);font-size:14px;transition:all .18s;background:var(--g50)}
.login-field input:focus{outline:none;border-color:var(--navy-600);background:#fff;box-shadow:0 0 0 4px rgba(20,58,92,.1)}
.login-error{display:none;background:var(--red-l);color:#b91c1c;padding:11px 14px;border-radius:var(--radius);font-size:13px;margin-bottom:16px;border:1px solid rgba(220,38,38,.2);font-weight:600;line-height:1.4;word-break:break-word}
.login-error.show{display:block;animation:slideUp .2s ease}
.login-btn{
  width:100%;padding:13px;border-radius:var(--radius);
  background:linear-gradient(180deg,var(--navy-700),var(--navy-800));
  color:#fff;font-size:14px;font-weight:700;transition:all .18s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.login-btn:hover:not(:disabled){background:linear-gradient(180deg,var(--navy-600),var(--navy-700));box-shadow:var(--shadow-md);transform:translateY(-1px)}
.login-btn:disabled{opacity:.6;cursor:wait}
.login-btn .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;display:none;flex-shrink:0}
.login-btn.loading .spinner{display:inline-block}
.login-btn.loading .btn-text{opacity:.7}

/* ---- Autenticação: esconde app ---- */
body:not(.autenticado) > header,
body:not(.autenticado) > .tabs-bar,
body:not(.autenticado) > main,
body:not(.autenticado) > .sidebar,
body:not(.autenticado) > .sidebar-backdrop{display:none !important}

/* ---- Modal base ---- */
.modal-overlay{position:fixed;inset:0;background:rgba(10,30,51,.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;animation:fadeIn .2s ease}
.modal{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:100%;max-width:860px;max-height:92vh;display:flex;flex-direction:column;animation:slideUp .25s cubic-bezier(.16,1,.3,1);overflow:hidden}
.modal.sm{max-width:540px}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--g200);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0;background:linear-gradient(180deg,#fff,var(--g50));position:relative}
.modal-head::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--gold-400),var(--gold-500))}
.modal-head h2{font-size:17px;font-weight:700;color:var(--g900);letter-spacing:-.2px;padding-left:6px;word-break:break-word;line-height:1.3;min-width:0}
.modal-close{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--g500);transition:all .15s;flex-shrink:0}
.modal-close:hover{background:var(--red-l);color:var(--red);transform:rotate(90deg)}
.modal-body{padding:24px;overflow-y:auto;flex:1;min-height:0}
.modal-foot{padding:16px 24px;border-top:1px solid var(--g200);display:flex;justify-content:flex-end;gap:10px;flex-shrink:0;background:var(--g50);flex-wrap:wrap}

/* ============================================================
   4. LAYOUT DESKTOP (min-width: 769px)
   ============================================================ */

/* ---- Header ---- */
header{
  background:linear-gradient(135deg,#081a2c 0%, var(--navy-800) 55%, var(--navy-700) 100%);
  color:#fff;padding:20px 28px;box-shadow:0 4px 20px -6px rgba(10,30,51,.4);
  position:sticky;top:0;z-index:50;
  border-bottom:1px solid rgba(201,164,74,.25);
  margin-left:var(--sidebar-w);
}
.header-wrap{max-width:1600px;margin:0 auto;display:flex;align-items:center;gap:20px;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;align-items:center;gap:16px;min-width:0;flex:1 1 auto}
.badge{
  width:54px;height:54px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,var(--gold-400),var(--gold-500) 70%);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;color:var(--navy-900);font-size:15px;letter-spacing:.5px;
  box-shadow:inset 0 -3px 6px rgba(0,0,0,.25),0 4px 12px rgba(201,164,74,.35);
  border:2px solid rgba(255,255,255,.4);flex-shrink:0;overflow:hidden;
}
.badge img{width:100%;height:100%;object-fit:contain;border-radius:50%}
.brand > div:last-child{min-width:0}
.brand h1{font-size:20px;font-weight:700;letter-spacing:.3px;word-break:break-word;line-height:1.25}
.brand p{font-size:12px;color:rgba(255,255,255,.72);margin-top:3px;word-break:break-word;line-height:1.35}
.header-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:flex-end;min-width:0}

/* ---- Tabs ---- */
.tabs-bar{background:#fff;border-bottom:1px solid var(--g200);position:sticky;top:92px;z-index:40;box-shadow:0 2px 8px -4px rgba(15,23,42,.05);margin-left:var(--sidebar-w)}
.tabs{max-width:1600px;margin:0 auto;display:flex;padding:0 28px;gap:4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:16px 24px;font-size:14px;font-weight:600;color:var(--g500);border-bottom:3px solid transparent;transition:all .18s;white-space:nowrap;position:relative;flex-shrink:0}
.tab:hover{background:linear-gradient(180deg,transparent,rgba(0,0,0,.03))}
.tab.active{color:var(--g900)}
.tab[data-cat="cb_sd"].active{color:var(--cat-cb-sd-dark);border-bottom-color:var(--cat-cb-sd)}
.tab[data-cat="cb_sd"].active::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--cat-cb-sd),transparent);filter:blur(3px)}
.tab[data-cat="subten_sgt"].active{color:var(--cat-subten-sgt-dark);border-bottom-color:var(--cat-subten-sgt)}
.tab[data-cat="subten_sgt"].active::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--cat-subten-sgt),transparent);filter:blur(3px)}
.tab[data-cat="oficiais"].active{color:var(--cat-oficiais-dark);border-bottom-color:var(--cat-oficiais)}
.tab[data-cat="oficiais"].active::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--cat-oficiais),transparent);filter:blur(3px)}
.tab[data-cat="efetivo"].active{color:var(--cat-efetivo-dark);border-bottom-color:var(--cat-efetivo)}
.tab[data-cat="efetivo"].active::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--cat-efetivo),transparent);filter:blur(3px)}

/* ---- Main ---- */
main{max-width:1600px;margin:0 auto;padding:26px 28px 60px;margin-left:var(--sidebar-w)}

/* ---- Stats ---- */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:22px}
.stat{
  background:#fff;border-radius:var(--radius-lg);padding:18px 20px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden;
  transition:transform .18s ease, box-shadow .18s ease;
  border:1px solid rgba(226,232,240,.8);min-width:0;
}
.stat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,var(--navy-600),var(--navy-800))}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.stat.green::before{background:linear-gradient(180deg,#4ade80,var(--green))}
.stat.amber::before{background:linear-gradient(180deg,#fbbf24,var(--amber))}
.stat.red::before{background:linear-gradient(180deg,#f87171,var(--red))}
.stat-label{font-size:11px;color:var(--g500);text-transform:uppercase;letter-spacing:.6px;font-weight:700;line-height:1.3}
.stat-value{font-size:26px;font-weight:800;color:var(--g900);letter-spacing:-.5px;line-height:1.1}
body[data-cat="cb_sd"] .stat.cat-primary::before{background:linear-gradient(180deg,#4ade80,var(--cat-cb-sd))}
body[data-cat="subten_sgt"] .stat.cat-primary::before{background:linear-gradient(180deg,#f87171,var(--cat-subten-sgt))}
body[data-cat="oficiais"] .stat.cat-primary::before{background:linear-gradient(180deg,var(--gold-400),var(--cat-oficiais))}
body[data-cat="efetivo"] .stat.cat-primary::before{background:linear-gradient(180deg,#60a5fa,var(--cat-efetivo))}

/* ---- Toolbar ---- */
.toolbar{display:flex;gap:12px;margin-bottom:22px;flex-wrap:wrap;align-items:center;background:#fff;padding:14px;border-radius:var(--radius-lg);box-shadow:var(--shadow);border:1px solid rgba(226,232,240,.8)}
.search-box{flex:1;min-width:220px;position:relative}
.search-box svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--g500);pointer-events:none}
.search-box input{width:100%;padding:11px 14px 11px 40px;border:1.5px solid var(--g200);border-radius:var(--radius);font-size:13px;transition:all .18s;background:var(--g50)}
.search-box input:focus{outline:none;border-color:var(--navy-600);background:#fff;box-shadow:0 0 0 4px rgba(20,58,92,.08)}

/* ---- Turma card ---- */
.turma{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden;border:1px solid rgba(226,232,240,.9);transition:box-shadow .2s ease}
.turma:hover{box-shadow:var(--shadow-md)}
.turma-head{display:flex;align-items:center;gap:16px;padding:16px 20px;background:linear-gradient(90deg,var(--navy-800),var(--navy-700));color:#fff;cursor:pointer;position:relative;flex-wrap:wrap}
.turma-head::after{content:'';position:absolute;left:0;bottom:0;height:1px;right:0;background:linear-gradient(90deg,transparent,rgba(201,164,74,.4),transparent)}
.turma::before{content:'';display:block;height:4px;background:linear-gradient(90deg,var(--navy-600),var(--navy-800))}
body[data-cat="cb_sd"] .turma::before{background:linear-gradient(90deg,var(--cat-cb-sd),var(--cat-cb-sd-dark))}
body[data-cat="subten_sgt"] .turma::before{background:linear-gradient(90deg,var(--cat-subten-sgt),var(--cat-subten-sgt-dark))}
body[data-cat="oficiais"] .turma::before{background:linear-gradient(90deg,var(--gold-400),var(--cat-oficiais))}
body[data-cat="efetivo"] .turma::before{background:linear-gradient(90deg,var(--cat-efetivo),var(--cat-efetivo-dark))}

/* Quadrado dourado — DESKTOP */
.turma-num{
  width:var(--turma-num-size);height:var(--turma-num-size);border-radius:12px;
  background:linear-gradient(180deg,var(--gold-400),var(--gold-500));color:var(--navy-900);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:var(--turma-num-font);line-height:1;
  flex-shrink:0;
  box-shadow:inset 0 -2px 4px rgba(0,0,0,.15),0 2px 6px rgba(201,164,74,.35);
  border:1px solid rgba(255,255,255,.35);
  overflow:hidden;padding:2px;text-align:center;
  word-break:break-word;overflow-wrap:anywhere;
}
.turma-num img{width:100%;height:100%;object-fit:contain;border-radius:8px;display:block}

.turma-info{flex:1 1 200px;min-width:0}
.turma-title{font-size:15px;font-weight:700;letter-spacing:.2px;word-break:break-word;line-height:1.3}
.turma-dates{font-size:12px;color:rgba(255,255,255,.72);margin-top:3px;display:flex;gap:14px;flex-wrap:wrap;line-height:1.35}
.turma-dates span{display:inline-flex;align-items:center;gap:5px;min-width:0}
.turma-count{background:rgba(255,255,255,.14);padding:7px 14px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(4px);white-space:nowrap;flex-shrink:0}
.turma-chevron{width:20px;height:20px;transition:transform .25s ease;flex-shrink:0;opacity:.85;margin-left:auto}
.turma.collapsed .turma-chevron{transform:rotate(-90deg)}
.turma.collapsed .turma-body{display:none}
.turma-body{padding:0}

/* ---- Tabela ---- */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:900px}
thead th{background:linear-gradient(180deg,#f8fafc,#f1f5f9);text-align:left;padding:12px 14px;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--g600);border-bottom:1px solid var(--g200);white-space:nowrap;position:sticky;top:0}
tbody td{padding:12px 14px;border-bottom:1px solid var(--g100);vertical-align:middle}
tbody tr{transition:background .12s, opacity .12s}
tbody tr:hover{background:linear-gradient(90deg,rgba(201,164,74,.04),rgba(20,58,92,.03))}
tbody tr:last-child td{border-bottom:none}
.cell-re{font-family:'SF Mono',Monaco,Consolas,monospace;font-weight:700;color:var(--navy-700);letter-spacing:.5px}
.cell-nome{font-weight:500;min-width:180px}
.cell-muted{color:var(--g500);font-size:12px}

/* ---- Drag & drop ---- */
tbody tr[draggable="true"]{cursor:default}
tbody tr.drag-over{background:rgba(37,99,235,.12) !important;outline:2px dashed var(--blue);outline-offset:-2px}
tbody tr .drag-handle{cursor:grab;user-select:none;touch-action:none;color:var(--g400)}
tbody tr .drag-handle:active{cursor:grabbing}

/* ---- Turma concluída ---- */
.turma.concluida{border-color:var(--green);box-shadow:0 0 0 2px rgba(22,163,74,.12), 0 8px 24px -6px rgba(22,163,74,.2)}
.turma.concluida .turma-head{background:linear-gradient(90deg,#0f3d23,#15803d)}
.turma.concluida .turma-num{background:linear-gradient(180deg,#86efac,#4ade80);color:#052e16}
.turma.concluida::before{background:linear-gradient(90deg,#22c55e,#16a34a) !important}

/* ---- Checkbox "Concluída" ---- */
.turma-check{display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:20px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);font-size:11px;font-weight:700;color:#fff;cursor:pointer;user-select:none;white-space:nowrap;transition:all .15s;flex-shrink:0}
.turma-check:hover{background:rgba(255,255,255,.22)}
.turma-check input{width:14px;height:14px;cursor:pointer;accent-color:#4ade80;flex-shrink:0}
.turma.concluida .turma-check{background:rgba(74,222,128,.22);border-color:rgba(74,222,128,.5)}

/* ---- Botões no cabeçalho da turma ---- */
.turma-actions{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;min-width:0}
.turma-actions .btn{padding:7px 13px;font-size:11px;font-weight:700;border-radius:8px;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.18);display:inline-flex;align-items:center;gap:6px;transition:all .15s;box-shadow:none;white-space:nowrap}
.turma-actions .btn:hover{background:rgba(255,255,255,.22);transform:translateY(-1px)}
.turma-actions .btn svg{width:14px;height:14px;flex-shrink:0}
.turma-actions .btn.btn-export{background:linear-gradient(180deg,rgba(201,164,74,.35),rgba(201,164,74,.25));border-color:rgba(201,164,74,.55);color:#fff}
.turma-actions .btn.btn-export:hover{background:linear-gradient(180deg,rgba(201,164,74,.55),rgba(201,164,74,.4))}

/* ============================================================
   5. LAYOUT MOBILE (max-width: 768px)
   ============================================================ */
@media (max-width:768px){

  /* ---- Ajuste de variáveis ---- */
  :root{
    --turma-num-size:42px;
    --turma-num-font:clamp(11px, 3.5vw, 14px);
  }

  /* ---- Base ---- */
  body{font-size:13.5px}

  /* Header e Main sem margem lateral em mobile (menu vira drawer) */
  header{margin-left:0;padding:14px 16px}
  main{margin-left:0;padding:14px 12px 40px}
  .tabs-bar{margin-left:0;top:0}

  /* ---- Header ---- */
  .header-wrap{flex-direction:column;align-items:stretch;gap:12px}
  .brand{gap:12px;align-items:center}
  .badge{width:46px;height:46px}
  .brand h1{font-size:16px;line-height:1.3}
  .brand p{font-size:11px;line-height:1.35}
  .header-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;width:100%}
  .header-actions .btn{width:100%;padding:10px 12px;font-size:12px;min-height:40px;justify-content:center}
  .header-actions .btn span.lbl{display:inline;font-size:12px}
  .header-actions .user-email{grid-column:1 / -1;max-width:100%;justify-content:center;display:flex}
  .conn-status{grid-column:1 / -1;justify-content:center;display:flex;width:100%}
  .btn-sync{padding:10px 12px;min-height:40px}
  .btn-sync .lbl{font-size:12px}

  /* ---- Tabs ---- */
  .tabs{padding:0 12px;gap:0}
  .tab{padding:12px 14px;font-size:12.5px}

  /* ---- Stats ---- */
  .stats-row{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:16px}
  .stat{padding:12px 14px;border-radius:12px}
  .stat-label{font-size:10px;letter-spacing:.4px}
  .stat-value{font-size:20px}

  /* ---- Toolbar ---- */
  .toolbar{padding:10px;gap:8px;border-radius:12px;margin-bottom:16px}
  .search-box{min-width:0;flex:1 1 100%}
  .search-box input{padding:10px 12px 10px 36px;font-size:13px}
  .search-box svg{left:12px;width:14px;height:14px}
  #btn-new-turma{width:100%;justify-content:center;padding:10px 14px}

  /* ---- Turma card ---- */
  .turma{margin-bottom:14px;border-radius:12px}
  .turma-head{
    padding:12px 14px;gap:10px;
    display:grid;
    grid-template-columns:var(--turma-num-size) 1fr auto;
    grid-template-areas:
      "num  info  chevron"
      "count count count"
      "check check check"
      "actions actions actions";
    align-items:center;
  }
  .turma-num{grid-area:num}
  .turma-info{grid-area:info;min-width:0}
  .turma-title{font-size:13.5px;line-height:1.35}
  .turma-dates{font-size:11px;gap:8px;margin-top:2px}
  .turma-chevron{grid-area:chevron;margin-left:0;width:18px;height:18px}
  .turma-count{grid-area:count;justify-self:start;font-size:11px;padding:5px 11px;margin-top:4px}
  .turma-check{grid-area:check;justify-self:start;font-size:11px;padding:6px 11px;margin-top:4px}
  .turma-actions{
    grid-area:actions;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(110px,1fr));
    gap:6px;width:100%;margin-top:6px;
  }
  .turma-actions .btn{
    width:100%;justify-content:center;padding:8px 10px;font-size:11px;
    white-space:normal;text-align:center;line-height:1.2;min-height:38px;
  }
  .turma-actions .btn svg{width:13px;height:13px}

  /* ---- Observações da turma ---- */
  .turma-obs{padding:10px 14px;gap:8px}
  .turma-obs-text{font-size:12.5px}
  .turma-obs-label{font-size:9.5px}

  /* ---- Tabela ---- */
  table{min-width:820px;font-size:12.5px}
  thead th{padding:10px;font-size:10.5px}
  tbody td{padding:10px}
  .cell-nome{min-width:150px}

  /* ---- Empty state ---- */
  .empty-state{padding:40px 16px}
  .empty-state svg{width:52px;height:52px}
  .empty-state h3{font-size:15px}
  .empty-state p{font-size:12.5px}

  /* ---- Modal ---- */
  .modal-overlay{padding:10px;align-items:flex-start;padding-top:14px;padding-bottom:14px}
  .modal{max-height:calc(100vh - 28px);border-radius:14px}
  .modal.sm{max-width:100%}
  .modal-head{padding:14px 16px}
  .modal-head h2{font-size:15px;line-height:1.35}
  .modal-body{padding:16px}
  .modal-foot{padding:12px 16px;gap:8px}
  .modal-foot .btn{flex:1 1 auto;justify-content:center;min-width:0;padding:10px 12px;font-size:12.5px}

  /* ---- Form ---- */
  .form-grid{gap:12px}
  .field.col-3,.field.col-4,.field.col-6,.field.col-8,.field.col-12{grid-column:span 12}
  .field input,.field select,.field textarea{font-size:16px;padding:10px 12px} /* evita zoom iOS */
  .section-title{font-size:11px;padding-left:10px}
  .conditional-group.show{padding:12px;gap:12px}

  /* ---- Checkbox ---- */
  .checkbox-wrap{padding:11px 12px;font-size:13px}
  .checkbox-wrap span{font-size:12.5px}
  .field .checkbox-wrap{padding:11px 12px}
  .field .checkbox-wrap span{font-size:12.5px}

  /* ---- Toasts ---- */
  #toasts{bottom:12px;right:12px;left:12px;max-width:none;align-items:stretch}
  .toast{min-width:0;max-width:none;width:100%;font-size:12.5px;padding:12px 14px;gap:10px}

  /* ---- Login ---- */
  .login-card{padding:28px 22px;max-width:100%}
  .login-card h2{font-size:18px}
  .login-card p.sub{font-size:12.5px;margin-bottom:22px}
  .login-logo{width:58px;height:58px;margin-bottom:16px}
  .login-field input{font-size:16px}

  /* ---- Import overlay ---- */
  .imp-overlay p{font-size:14px}
  .imp-overlay small{font-size:11.5px}
  .imp-spinner{width:48px;height:48px}
}

/* ============================================================
   6. MOBILE PEQUENO (max-width: 480px)
   ============================================================ */
@media (max-width:480px){
  :root{
    --turma-num-size:38px;
    --turma-num-font:clamp(10px, 3.8vw, 12px);
  }

  .brand h1{font-size:14.5px}
  .brand p{font-size:10.5px}
  .badge{width:42px;height:42px}

  .header-actions{grid-template-columns:repeat(2,minmax(0,1fr))}
  .header-actions .btn span.lbl{display:none}
  .header-actions .btn svg{width:18px;height:18px}
  .header-actions .user-email,
  .header-actions .conn-status{grid-column:1 / -1}

  .stats-row{gap:8px}
  .stat{padding:10px 12px}
  .stat-label{font-size:9.5px}
  .stat-value{font-size:18px}

  .tab{padding:10px 12px;font-size:12px}

  .turma-head{padding:10px 12px}
  .turma-title{font-size:12.5px}
  .turma-dates{font-size:10.5px}
  .turma-count,.turma-check{font-size:10.5px;padding:5px 10px}

  .turma-actions{grid-template-columns:1fr 1fr}
  .turma-actions .btn{font-size:10.5px;padding:7px 8px;min-height:36px}
  .turma-actions .btn svg{width:12px;height:12px}

  .toolbar{padding:8px}
  .stat-value{letter-spacing:-.3px}

  .login-card{padding:24px 18px}
  .login-card h2{font-size:17px}
  .login-logo{width:52px;height:52px;font-size:15px}

  .modal-body{padding:14px}
  .modal-head{padding:12px 14px}
  .modal-head h2{font-size:14px}
  .modal-foot{padding:10px 14px}
  .modal-foot .btn{padding:9px 10px;font-size:12px}
}

/* ============================================================
   7. MOBILE MUITO PEQUENO (max-width: 360px)
   ============================================================ */
@media (max-width:360px){
  :root{
    --turma-num-size:36px;
    --turma-num-font:clamp(9px, 4vw, 11px);
  }

  .brand h1{font-size:13.5px}
  .badge{width:38px;height:38px}
  .turma-actions{grid-template-columns:1fr}
  .stats-row{grid-template-columns:1fr 1fr}
  .stat-value{font-size:16px}
  .header-actions{grid-template-columns:1fr 1fr}
}

/* ============================================================
   8. AJUSTES FINOS
   ============================================================ */

/* Telas médias — compacta o cabeçalho da turma */
@media (max-width:1024px) and (min-width:769px){
  .header-wrap{gap:14px}
  .brand h1{font-size:18px}
  .turma-head{gap:12px}
  .turma-info{flex-basis:100%}
  .turma-actions{flex-basis:100%;justify-content:flex-start}
  .turma-chevron{margin-left:0}
}

/* Paisagem mobile (altura baixa) */
@media (max-width:900px) and (orientation:landscape) and (max-height:500px){
  header{padding:10px 14px}
  .header-wrap{flex-direction:row;align-items:center}
  .brand h1{font-size:15px}
  .header-actions{width:auto;grid-template-columns:repeat(auto-fit,minmax(90px,1fr))}
  .tabs-bar{position:static}
  .modal{max-height:calc(100vh - 20px)}
}

/* ============================================================
   9. MENU LATERAL ESQUERDO (SIDEBAR)
   ============================================================ */
.sidebar{
  position:fixed;
  top:0;left:0;bottom:0;
  width:var(--sidebar-w);
  background:linear-gradient(180deg,#081a2c 0%, var(--navy-800) 100%);
  color:#fff;
  padding:18px 14px;
  overflow-y:auto;
  z-index:60;
  box-shadow:2px 0 14px rgba(0,0,0,.18);
  border-right:1px solid rgba(201,164,74,.25);
  display:flex;flex-direction:column;gap:18px;
  -webkit-overflow-scrolling:touch;
}
.sidebar-brand{
  display:flex;align-items:center;gap:10px;
  padding-bottom:14px;
  border-bottom:1px solid rgba(255,255,255,.1);
}
.sidebar-brand .badge-sm{
  width:40px;height:40px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,var(--gold-400),var(--gold-500) 70%);
  display:flex;align-items:center;justify-content:center;

/* ============================================================

const SUPABASE_URL  = 'https://fczorwrqwrjeknmkiorz.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZjem9yd3Jxd3JqZWtubWtpb3J6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzOTcyNTMsImV4cCI6MjEwNzk3MzI1M30.iBxs6xmlq2llD-4kMGbWNvtxMGX0gBw4ulR8RiKe9IQ';

let sb = null;
let supabaseOnline = false;

try {
  if (window.supabase && SUPABASE_URL.startsWith('https://') && !SUPABASE_URL.includes('SEU-PROJETO')){
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
  }
} catch(e){
  console.warn('Supabase não configurado:', e);
}

/* ============================================================
   AUTENTICAÇÃO — Login / Logout / Sessão
   ============================================================ */

function mostrarLogin(){
  document.body.classList.remove('autenticado');
  const tela = document.getElementById('login-screen');
  if (tela) tela.classList.remove('hidden');
}

function esconderLogin(){
  document.body.classList.add('autenticado');
  const tela = document.getElementById('login-screen');
  if (tela) tela.classList.add('hidden');
}

function mostrarErroLogin(msg){
  const el = document.getElementById('login-error');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
}

function limparErroLogin(){
  const el = document.getElementById('login-error');
  if (!el) return;
  el.textContent = '';
  el.classList.remove('show');
}

function traduzirErroAuth(msg){
  const m = String(msg || '').toLowerCase();
  if (m.includes('invalid login credentials')) return 'E-mail ou senha incorretos.';
  if (m.includes('email not confirmed'))       return 'E-mail ainda não confirmado. Verifique sua caixa de entrada.';
  if (m.includes('too many requests'))         return 'Muitas tentativas. Aguarde alguns minutos.';
  if (m.includes('user not found'))            return 'Usuário não encontrado.';
  if (m.includes('network'))                   return 'Falha de rede. Verifique sua conexão.';
  return 'Não foi possível entrar: ' + msg;
}

async function fazerLogin(email, senha){
  if (!sb) throw new Error('Supabase não está configurado.');
  const { data, error } = await sb.auth.signInWithPassword({
    email: email.trim().toLowerCase(),
    password: senha
  });
  if (error) throw error;
  return data;
}

async function fazerLogout(){
  if (!sb) return;
  try { await sb.auth.signOut(); } catch(e){ console.warn(e); }
}

function atualizarEmailHeader(user){
  const el = document.getElementById('user-email');
  if (!el) return;
  if (user && user.email){
    el.textContent = user.email;
    el.title = user.email;
  } else {
    el.textContent = '—';
    el.title = '';
  }
}

async function entrarNoApp(user){
  esconderLogin();
  atualizarEmailHeader(user);
  try {
    if (sb){
      const ok = await checarConexaoSupabase();
      if (ok){
        await sincronizarComSupabase({ silencioso: true });
      }
    }
  } catch(e){
    console.warn('Falha ao sincronizar após login:', e);
  }
  render();
}

async function checarConexaoSupabase(){
  const el = document.getElementById('conn-status');
  if (!sb){
    if (el){
      el.textContent = 'Local (sem Supabase)';
      el.className = 'conn-status offline';
      el.title = 'Configure SUPABASE_URL e SUPABASE_ANON para ativar a base central.';
    }
    supabaseOnline = false;
    return false;
  }

  const timeout = new Promise((_, reject) =>
    setTimeout(() => reject(new Error('Timeout ao verificar conexão (8s)')), 8000)
  );

  try {
    console.log('[conn] verificando...');
    const tarefa = sb
      .from('policiais')
      .select('re', { count: 'exact', head: true })
      .limit(1);

    const { error } = await Promise.race([tarefa, timeout]);
    if (error) throw error;

    if (el){
      el.textContent = 'Supabase Online';
      el.className = 'conn-status online';
      el.title = 'Conectado à base central de policiais.';
    }
    supabaseOnline = true;
    console.log('[conn] ok');
    return true;
  } catch(err){
    console.error('[conn] falha:', err);
    if (el){
      el.textContent = 'Supabase Offline';
      el.className = 'conn-status offline';
      el.title = 'Sem conexão com o Supabase: ' + (err.message || err);
    }
    supabaseOnline = false;
    return false;
  }
}

function setConnStatus(state, text){
  const el = document.getElementById('conn-status');
  if (!el) return;
  if (state === 'syncing'){
    el.textContent = text || 'Sincronizando...';
    el.className = 'conn-status syncing';
  }
}

/* ============================================================
   EAP 2027 — APP PRINCIPAL
   ============================================================ */
const AVAILABLE_YEARS = [2027, 2028, 2029, 2030];
let currentYear = 2027;

function storageKeyForYear(year){ return `eap${year}_db_v1`; }

function loadDBForYear(year){
  try {
    const raw = localStorage.getItem(storageKeyForYear(year));
    if (raw){
      const parsed = JSON.parse(raw);
      if (!parsed.officers) parsed.officers = [];
      if (!parsed.turmas)   parsed.turmas   = [];
      return parsed;
    }
  } catch(e){ console.warn('DB corrompida (ano ' + year + '), iniciando nova.', e); }
  return { officers: [], turmas: [] };
}

let db = loadDBForYear(currentYear);
db.turmas.forEach(t => {
  if (typeof t.concluida !== 'boolean') t.concluida = false;
  if (typeof t.observacoes !== 'string') t.observacoes = '';
});

function saveDB(){ localStorage.setItem(storageKeyForYear(currentYear), JSON.stringify(db)); }

const CATEGORIES = [
  { id: 'cb_sd',      label: 'Cb/Sd',          color: '#16a34a' },
  { id: 'subten_sgt', label: 'Subten/Sgt',     color: '#dc2626' },
  { id: 'oficiais',   label: 'Oficiais',       color: '#c9a44a' },
  { id: 'efetivo',    label: 'Efetivo 3º B.C.', color: '#2563eb' }
];
const REAL_CATEGORIES = CATEGORIES.filter(c => c.id !== 'efetivo');

const TAF_IV_OPTIONS = [
  'Lesão Membros Superiores',
  'Lesão Membros Inferiores',
  'Coluna Vertebral',
  'Cardíaco'
];
const POSTOS = ['Cel PM','Ten Cel PM','Maj PM','Cap PM','1° TEN PM','2° TEN PM',
  'Subten PM','1° SGT PM','2° SGT PM','3° SGT PM','CABO PM','SD PM'];

const state = { activeCategory: 'efetivo', search: '' };

/* ============================================================
   PERSISTÊNCIA LOCAL — ano a ano
   ============================================================ */
function switchYear(year){
  if (year === currentYear) return;
  saveDB();
  currentYear = year;
  db = loadDBForYear(year);
  db.turmas.forEach(t => {
    if (typeof t.concluida !== 'boolean') t.concluida = false;
    if (typeof t.observacoes !== 'string') t.observacoes = '';
  });
  seedYearIfEmpty();
  updateYearSelector();
  render();
  toast(`Ano alterado para ${year}.`, 'info');
}

function updateYearSelector(){
  const sel = document.getElementById('year-select');
  if (sel) sel.value = String(currentYear);
}

function seedYearIfEmpty(){
  if (db.officers.length > 0 || db.turmas.length > 0) return;
  REAL_CATEGORIES.forEach(c => {
    db.turmas.push({
      id: uid(),
      categoria: c.id,
      numero: 'I',
      dataInicio: '',
      dataFim: '',
      concluida: false,
      observacoes: ''
    });
  });
  saveDB();
}

/* ============================================================
   HELPERS
   ============================================================ */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function escapeHTML(s){
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function fmtDate(iso){
  if (!iso) return '—';
  const d = new Date(iso + (iso.length === 10 ? 'T00:00:00' : ''));
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('pt-BR');
}
function fmtDateShort(iso){
  if (!iso) return '—';
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d)) return iso;
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = d.toLocaleString('pt-BR',{month:'short'}).replace('.','').toUpperCase();
  const yy = String(d.getFullYear()).slice(2);
  return `${dd}${mm}${yy}`;
}
function addDays(iso, days){
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0,10);
}
function romanToInt(r){
  const map = {I:1,V:5,X:10,L:50,C:100,D:500,M:1000};
  let n = 0;
  const s = String(r||'').toUpperCase();
  if (!s) return 999;
  for (let i=0;i<s.length;i++){
    const c = map[s[i]]; const nx = map[s[i+1]];
    if (!c) return 999;
    if (nx && c < nx) n -= c; else n += c;
  }
  return n || 999;
}
function intToRoman(num){
  if (!num || num < 1 || num > 3999) return String(num);
  const map = [
    ['M',1000],['CM',900],['D',500],['CD',400],
    ['C',100],['XC',90],['L',50],['XL',40],
    ['X',10],['IX',9],['V',5],['IV',4],['I',1]
  ];
  let out = '';
  for (const [sym, val] of map){
    while (num >= val){ out += sym; num -= val; }
  }
  return out;
}
function proximaNumeracaoTurma(categoria){
  const turmas = db.turmas.filter(t => t.categoria === categoria);
  let maior = 0;
  turmas.forEach(t => {
    const s = String(t.numero || '').toUpperCase().trim();
    if (!/^[IVXLCDM]+$/.test(s)) return;
    const n = romanToInt(s);
    if (n !== 999 && n > maior) maior = n;
  });
  return intToRoman(maior + 1);
}
function toast(msg, type='info'){
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => { el.style.opacity='0'; el.style.transition='opacity .3s'; }, 3500);
  setTimeout(() => el.remove(), 4000);
}
function sortTurmas(a,b){
  const da  = a.dataInicio || '9999-99-99';
  const dbb = b.dataInicio || '9999-99-99';
  if (da !== dbb) return da.localeCompare(dbb);
  return romanToInt(a.numero) - romanToInt(b.numero);
}

/* ============================================================
   ORDENAÇÃO MANUAL (drag & drop) — por turma + sync Supabase
   ============================================================ */
function sortOfficersManual(a, b){
  const oa = (typeof a.ordemManual === 'number') ? a.ordemManual : 999999;
  const ob = (typeof b.ordemManual === 'number') ? b.ordemManual : 999999;
  if (oa !== ob) return oa - ob;
  return (a.nome || '').localeCompare(b.nome || '', 'pt-BR');
}

async function aplicarOrdemManual(listaIds){
  listaIds.forEach((id, idx) => {
    const o = db.officers.find(x => x.id === id);
    if (o) o.ordemManual = idx;
  });
  saveDB();

  if (sb && supabaseOnline){
    try {
      const updates = listaIds.map((id, idx) => {
        const o = db.officers.find(x => x.id === id);
        return o ? { re: o.re, ordem_manual: idx } : null;
      }).filter(Boolean);

      const LOTE = 20;
      for (let i = 0; i < updates.length; i += LOTE){
        const lote = updates.slice(i, i + LOTE);
        await Promise.all(lote.map(u =>
          sb.from('policiais')
            .update({ ordem_manual: u.ordem_manual })
            .eq('re', u.re)
        ));
      }
    } catch(e){
      console.warn('Falha ao sincronizar ordem com Supabase:', e);
    }
  }
}

async function enviarOrdemTurmaSupabase(officers){
  if (!sb || !supabaseOnline) return;
  try {
    const LOTE = 20;
    for (let i = 0; i < officers.length; i += LOTE){
      const lote = officers.slice(i, i + LOTE);
      await Promise.all(lote.map(o =>
        sb.from('policiais')
          .update({ ordem_manual: o.ordemManual })
          .eq('re', o.re)
      ));
    }
  } catch(e){
    console.warn('Falha ao sincronizar ordem automática:', e);
  }
}

/* ============================================================

function normalizeDate(v){
  if (!v) return '';
  v = String(v).trim();
  if (!v) return '';
  if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
  const m = v.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2,4})$/);
  if (m){
    let [_, d, mo, y] = m;
    if (y.length === 2) y = (parseInt(y, 10) > 50 ? '19' : '20') + y;
    const dd = String(d).padStart(2, '0');
    const mm = String(mo).padStart(2, '0');
    return `${y}-${mm}-${dd}`;
  }
  return '';
}
function normalizeHeader(h){

/* ============================================================
   CSV PARSER / WRITER
   ============================================================ */
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i=0;i<text.length;i++){
    const c = text[i];
    if (inQuotes){
      if (c === '"'){
        if (text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',' || c === ';'){ row.push(field); field=''; }
      else if (c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if (c === '\r') {}
      else field += c;
    }
  }
  if (field !== '' || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length && r.some(c => c !== ''));
}
function downloadCSV(rows, filename){
  const esc = v => {
    v = v == null ? '' : String(v);
    if (/[",;\n]/.test(v)) return '"' + v.replace(/"/g,'""') + '"';
    return v;
  };
  const csv = rows.map(r => r.map(esc).join(';')).join('\r\n');
  const blob = new Blob(['\uFEFF' + csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function downloadXLSX(sheets, filename){
  if (typeof XLSX === 'undefined'){
    toast('Biblioteca de Excel não carregada.', 'error');
    return;
  }
  const wb = XLSX.utils.book_new();
  sheets.forEach(({ name, rows }) => {
    const ws = XLSX.utils.aoa_to_sheet(rows);
    const colWidths = [];
    rows.forEach(r => {
      (r || []).forEach((c, i) => {
        const len = String(c ?? '').length + 2;
        if (!colWidths[i] || colWidths[i] < len) colWidths[i] = len;
      });
    });
    ws['!cols'] = colWidths.map(w => ({ wch: Math.min(Math.max(w || 10, 10), 60) }));
    XLSX.utils.book_append_sheet(wb, ws, name);
  });
  XLSX.writeFile(wb, filename);
}

function renderContent(){

  const q = state.search.trim().toLowerCase();

  const officerMatches = o => {
    if (!q) return true;
    return [o.re,o.nome,o.ciaSecao,o.postoGrad,o.turma,o.taf].some(v =>
      String(v||'').toLowerCase().includes(q)
    );
  };

  if (state.activeCategory === 'efetivo'){
    const todos = db.officers.filter(officerMatches).sort(sortOfficersManual);

    if (todos.length === 0){
      container.innerHTML = `
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M9 7a4 4 0 100 8 4 4 0 000-8zM23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
          <h3>Nenhum policial no Efetivo 3º B.C.</h3>
          <p>Clique em <strong>"Importar Base"</strong> para carregar a planilha com todos os policiais, ou em <strong>"Sincronizar"</strong> para baixar da base central.</p>
        </div>`;
      return;
    }

    let html = '';
    REAL_CATEGORIES.forEach(cat => {
      const grupo = todos.filter(o => o.categoria === cat.id).sort(sortOfficersManual);
      if (grupo.length === 0) return;
      html += renderTurma({
        id: '__efetivo_' + cat.id,
        numero: cat.label,
        categoria: cat.id,
        dataInicio: '',
        dataFim: '',
        _virtual: true,
        _tituloCustom: 'Efetivo 3º B.C. — ' + cat.label
      }, grupo);
    });

    const semCat = todos
      .filter(o => !REAL_CATEGORIES.find(c => c.id === o.categoria))
      .sort(sortOfficersManual);
    if (semCat.length){
      html += renderTurma({
        id: '__efetivo_outros',
        numero: '—',
        categoria: 'cb_sd',
        dataInicio: '',
        dataFim: '',
        _virtual: true,
        _tituloCustom: 'Efetivo 3º B.C. — Não classificados'
      }, semCat);
    }

    container.innerHTML = html;
    bindTurmaEvents(container);
    return;
  }

  let turmas = db.turmas.filter(t => t.categoria === state.activeCategory).sort(sortTurmas);

  if (q){
    turmas = turmas.map(t => ({
      ...t,
      _filtered: db.officers
        .filter(o => o.turmaId === t.id && officerMatches(o))
        .sort(sortOfficersManual)
    })).filter(t => t._filtered.length > 0);
  } else {
    turmas = turmas.map(t => ({
      ...t,
      _filtered: db.officers
        .filter(o => o.turmaId === t.id)
        .sort(sortOfficersManual)
    }));
  }

  if (turmas.length === 0){
    container.innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 12h6m-6 4h6M9 8h6M5 3h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2z"/></svg>
        <h3>Nenhuma turma cadastrada</h3>
        <p>Clique em <strong>"Nova Turma"</strong> para começar a organizar o efetivo. Policiais sem turma aparecem no <strong>Efetivo 3º B.C.</strong></p>
      </div>`;
    return;
  }

  let html = '';
  turmas.forEach(t => html += renderTurma(t, t._filtered));
  container.innerHTML = html;
  bindTurmaEvents(container);
}

function bindTurmaEvents(container){
  container.querySelectorAll('.turma-head').forEach(head => {
    head.addEventListener('click', e => {
      if (e.target.closest('.turma-actions, .turma-check')) return;
      head.closest('.turma').classList.toggle('collapsed');
    });
  });

  container.querySelectorAll('[data-action]:not(input[type="checkbox"])').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const action  = btn.dataset.action;
      const id      = btn.dataset.id;
      const turmaId = btn.dataset.turma;
      if (action === 'edit-officer')  openOfficerModal(db.officers.find(o => o.id === id));
      if (action === 'del-officer')   confirmDeleteOfficer(id);
      if (action === 'edit-turma')    openTurmaModal(db.turmas.find(t => t.id === turmaId));
      if (action === 'del-turma')     confirmDeleteTurma(turmaId);
      if (action === 'add-to-turma')  openOfficerModal(null, turmaId);
      if (action === 'export-turma')  exportTurma(turmaId);
      if (action === 'reset-ordem')   resetOrdemTurma(turmaId);
    });
  });

  container.querySelectorAll('input[type="checkbox"][data-action="toggle-concluida"]').forEach(cb => {
    cb.addEventListener('click', e => e.stopPropagation());
    cb.addEventListener('change', e => {
      e.stopPropagation();
      toggleTurmaConcluida(cb.dataset.turma, cb.checked);
    });
  });

  // ---------- DRAG & DROP (desktop) ----------
  container.querySelectorAll('tbody').forEach(tbody => {
    let draggedRow = null;

    tbody.querySelectorAll('tr[draggable="true"]').forEach(tr => {
      tr.addEventListener('dragstart', e => {
        draggedRow = tr;
        tr.style.opacity = '0.4';
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setData('text/plain', tr.dataset.officerId); } catch(_){}
      });
      tr.addEventListener('dragend', () => {
        if (draggedRow) draggedRow.style.opacity = '';
        draggedRow = null;
        tbody.querySelectorAll('tr').forEach(r => r.classList.remove('drag-over'));
      });
      tr.addEventListener('dragover', e => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        if (!draggedRow || draggedRow === tr) return;
        tr.classList.add('drag-over');
      });
      tr.addEventListener('dragleave', () => {
        tr.classList.remove('drag-over');
      });
      tr.addEventListener('drop', e => {
        e.preventDefault();
        tr.classList.remove('drag-over');
        if (!draggedRow || draggedRow === tr) return;

        const rect = tr.getBoundingClientRect();
        const middle = rect.top + rect.height / 2;
        const before = e.clientY < middle;

        if (before) tbody.insertBefore(draggedRow, tr);
        else        tbody.insertBefore(draggedRow, tr.nextSibling);

        salvarOrdemDoTbody(tbody);
      });
    });
  });

  // ---------- DRAG & DROP (touch — mobile/tablet) ----------
  container.querySelectorAll('tbody').forEach(tbody => {
    let touchRow = null;

    tbody.querySelectorAll('tr[draggable="true"]').forEach(tr => {
      const handle = tr.querySelector('.drag-handle');
      if (!handle) return;

      handle.addEventListener('touchstart', e => {
        touchRow = tr;
        tr.style.opacity = '0.6';
        tr.style.background = 'rgba(201,164,74,.08)';
      }, { passive: true });

      handle.addEventListener('touchmove', e => {
        if (!touchRow) return;
        e.preventDefault();
        const y = e.touches[0].clientY;
        const el = document.elementFromPoint(e.touches[0].clientX, y);
        const targetRow = el && el.closest('tr[draggable="true"]');
        if (!targetRow || targetRow === touchRow) return;

        const rect = targetRow.getBoundingClientRect();
        const middle = rect.top + rect.height / 2;
        const before = y < middle;

        if (before) tbody.insertBefore(touchRow, targetRow);
        else        tbody.insertBefore(touchRow, targetRow.nextSibling);
      }, { passive: false });

      handle.addEventListener('touchend', () => {
        if (!touchRow) return;
        touchRow.style.opacity = '';
        touchRow.style.background = '';
        salvarOrdemDoTbody(tbody);
        touchRow = null;
      });
    });
  });
}

async function salvarOrdemDoTbody(tbody){
  const ids = Array.from(tbody.querySelectorAll('tr[data-officer-id]'))
    .map(tr => tr.dataset.officerId)
    .filter(Boolean);
  if (!ids.length) return;
  await aplicarOrdemManual(ids);
  toast('Ordem da turma salva.', 'success');
}

/* ============================================================
   RESETAR ORDEM AUTOMÁTICA (por Cia/Seção)
   ============================================================ */
async function resetOrdemTurma(turmaId){
  if (!turmaId || String(turmaId).startsWith('__efetivo_')) {
    toast('Ação disponível apenas em turmas reais.', 'info');
    return;
  }
  const officers = db.officers.filter(o => o.turmaId === turmaId);
  if (!officers.length){
    toast('Turma sem policiais para reordenar.', 'info');
    return;
  }

  const norm = v => String(v||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
  officers.sort((a,b) => {
    const ca = norm(a.ciaSecao), cb = norm(b.ciaSecao);
    if (ca !== cb){
      if (!ca) return 1; if (!cb) return -1;
      return ca.localeCompare(cb, 'pt-BR', { numeric:true });
    }
    const ordemPosto = {}; POSTOS.forEach((p,i)=>{ordemPosto[p]=i;});
    const pa = ordemPosto[a.postoGrad] ?? 999;
    const pb = ordemPosto[b.postoGrad] ?? 999;
    if (pa !== pb) return pa - pb;
    return (a.nome||'').localeCompare(b.nome||'', 'pt-BR');
  });
  officers.forEach((o,i) => { o.ordemManual = i; });
  saveDB();

  await enviarOrdemTurmaSupabase(officers);

  render();
  toast('Ordem automática (Cia/Seção) restaurada.', 'info');
}

/* ============================================================
   MODAL GENÉRICO
   ============================================================ */
function openModal({ title, bodyHTML, footerHTML, size='' }){
  const root = document.getElementById('modal-root');
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal ${size}">
      <div class="modal-head">
        <h2>${escapeHTML(title)}</h2>
        <button class="modal-close" data-close>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body">${bodyHTML}</div>
      ${footerHTML ? `<div class="modal-foot">${footerHTML}</div>` : ''}
    </div>
  `;
  root.innerHTML = '';
  root.appendChild(overlay);

  const close = () => { root.innerHTML = ''; };
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
  overlay.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', close));
  const onEsc = e => { if (e.key === 'Escape'){ close(); document.removeEventListener('keydown', onEsc); } };
  document.addEventListener('keydown', onEsc);
  return { close, overlay };
}

    `<option value="${t}" ${t===o.tafIVTipo?'selected':''}>${t}</option>`
  ).join('');

  const body = `
    <form id="officer-form" autocomplete="off">

        <div class="field col-6">
          <label>Categoria <span class="req">*</span></label>

        </div>
        <div class="field col-6">
          <label>Turma</label>
          <select name="turmaId">${turmaOptions}</select>
          <span class="hint">Deixe em "Sem turma" para o policial aparecer apenas no Efetivo 3º B.C.</span>
        </div>

        <div class="section-title">Identificação</div>

        <div class="field col-4">
          <label>Posto / Graduação <span class="req">*</span></label>
          <input name="postoGrad" list="postos" required value="${escapeHTML(o.postoGrad)}" placeholder="Ex.: 1° SGT PM">
          <datalist id="postos">${postosOptions}</datalist>
        </div>
        <div class="field col-4">
          <label>RE <span class="req">*</span></label>
          <input name="re" maxlength="6" pattern="\\d{6}" inputmode="numeric" required
                 value="${escapeHTML(o.re)}" placeholder="6 dígitos">
          <div class="re-autofill" id="re-autofill">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
            <span id="re-autofill-text">Dados preenchidos automaticamente</span>
          </div>
        </div>
        <div class="field col-4">
          <label>Dg <span class="req">*</span></label>
          <input name="dg" maxlength="1" required value="${escapeHTML(o.dg)}" placeholder="Ex.: A">
        </div>

        <div class="field col-12">
          <label>Nome Completo <span class="req">*</span></label>
          <input name="nome" required value="${escapeHTML(o.nome)}" placeholder="Nome de guerra ou completo">
        </div>

        <div class="field col-6">
          <label>Cia / Seção <span class="req">*</span></label>
          <input name="ciaSecao" required value="${escapeHTML(o.ciaSecao)}" placeholder="Ex.: 3 CIA PM">
        </div>
        <div class="field col-3">
          <label>TAF <span class="req">*</span></label>
          <select name="taf" required>
            <option value="III" ${o.taf==='III'?'selected':''}>III</option>
            <option value="IV"  ${o.taf==='IV'?'selected':''}>IV</option>
          </select>
        </div>
        <div class="field col-3"></div>

        <div class="conditional-group" id="taf-iv-group">
          <div class="field col-6">
            <label>Tipo de Restrição (TAF IV) <span class="req">*</span></label>
            <select name="tafIVTipo" id="tafIVTipo">
              <option value="">— Selecione —</option>
              ${tafIVOptions}
            </select>
          </div>
        </div>

        <div class="section-title">Datas</div>
        <div class="field col-3">
          <label>Data de Nascimento</label>
          <input type="date" name="dataNascimento" value="${o.dataNascimento||''}">
        </div>
        <div class="field col-3">
          <label>Exame Médico</label>
          <input type="date" name="dataExameMedico" value="${o.dataExameMedico||''}">
        </div>
        <div class="field col-3">
          <label>Exame Odontológico</label>
          <input type="date" name="dataExameOdonto" value="${o.dataExameOdonto||''}">
        </div>
        <div class="field col-3">
          <label>Validade IAS</label>
          <input type="date" name="validadeIAS" value="${o.validadeIAS||''}">
        </div>

        <div class="section-title">EAD</div>

        <div class="field col-6">
          <label>Inserido no EAD?</label>
          <label class="checkbox-wrap ${o.inseridoEAD==='Sim'?'checked':''}" id="wrap-inserido">
            <input type="checkbox" name="inseridoEAD" id="inseridoEAD" ${o.inseridoEAD==='Sim'?'checked':''}>
            <span>Sim, inserido no EAD</span>
          </label>
        </div>
        <div class="field col-6">
          <label>Concluiu o EAD?</label>
          <label class="checkbox-wrap ${o.concluiuEAD==='Sim'?'checked':''}" id="wrap-concluiu">
            <input type="checkbox" name="concluiuEAD" id="concluiuEAD" ${o.concluiuEAD==='Sim'?'checked':''}>
            <span>Sim, concluiu o EAD</span>
          </label>
        </div>

        <div class="conditional-group" id="ead-concluido-group">
          <div class="field col-4">
            <label>Nota EAD</label>
            <input name="notaEAD" value="${escapeHTML(o.notaEAD)}" placeholder="Ex.: 9,5">
          </div>
          <div class="field col-8">
            <label>Data de Conclusão do EAD</label>
            <input type="date" name="dataConclusaoEAD" value="${o.dataConclusaoEAD||''}">
            <span class="hint">Deixe vazio se ainda não concluiu — aparecerá como "Não Concluído".</span>
          </div>
        </div>
      </div>
    </form>
  `;

  const footer = `
    <button class="btn btn-outline" data-close>Cancelar</button>
    <button class="btn btn-primary" id="save-officer">${isEdit?'Salvar Alterações':'Adicionar Policial'}</button>
  `;

  const { close } = openModal({
    title: isEdit ? 'Editar Policial' : 'Novo Policial',
    bodyHTML: body, footerHTML: footer
  });

  const form        = document.getElementById('officer-form');
  const tafSel      = form.querySelector('[name="taf"]');
  const tafIVGroup  = document.getElementById('taf-iv-group');
  const tafIVSel    = document.getElementById('tafIVTipo');
  const inseridoSel = form.querySelector('[name="inseridoEAD"]');
  const concluiuSel = form.querySelector('[name="concluiuEAD"]');
  const wrapInserido = document.getElementById('wrap-inserido');
  const wrapConcluiu = document.getElementById('wrap-concluiu');
  const eadGroup    = document.getElementById('ead-concluido-group');
  const reInput     = form.querySelector('[name="re"]');
  const autoFillBadge = document.getElementById('re-autofill');
  const autoFillText  = document.getElementById('re-autofill-text');
  const catSel      = form.querySelector('[name="categoria"]');
  const turmaSel    = form.querySelector('[name="turmaId"]');

  function refreshTurmas(){
    const lista = db.turmas.filter(t => t.categoria === catSel.value).sort(sortTurmas);
    const atual = turmaSel.value;
    turmaSel.innerHTML = '<option value="">— Sem turma (Efetivo 3º B.C.) —</option>' +
      lista.map(t => `<option value="${t.id}">Turma ${escapeHTML(t.numero)}</option>`).join('');
    if (atual && lista.find(t => t.id === atual)) turmaSel.value = atual;
  }
  catSel.addEventListener('change', refreshTurmas);

  function updateTafIV(){
    const isIV = tafSel.value === 'IV';
    tafIVGroup.classList.toggle('show', isIV);
    tafIVSel.required = isIV;
  }
  function updateEAD(){
    const showEAD = concluiuSel.checked;
    eadGroup.classList.toggle('show', showEAD);
    form.querySelector('[name="notaEAD"]').disabled          = !showEAD;
    form.querySelector('[name="dataConclusaoEAD"]').disabled = !showEAD;
    wrapInserido.classList.toggle('checked', inseridoSel.checked);
    wrapConcluiu.classList.toggle('checked', concluiuSel.checked);
  }

  tafSel.addEventListener('change', updateTafIV);

  inseridoSel.addEventListener('change', () => {
    if (!inseridoSel.checked) concluiuSel.checked = false;
    updateEAD();
  });
  concluiuSel.addEventListener('change', () => {
    if (concluiuSel.checked) inseridoSel.checked = true;
    updateEAD();
  });

  updateTafIV(); updateEAD();

  let autoFillTimeout;
  reInput.addEventListener('input', async () => {
    clearTimeout(autoFillTimeout);
    autoFillTimeout = setTimeout(async () => {
      const re = reInput.value.trim();
      autoFillBadge.classList.remove('show', 'warn', 'info');
      if (re.length !== 6) return;

      let found = null;
      let origem = '';

      if (sb){
        try {
          const { data, error } = await sb
            .from('policiais')
            .select('*')
            .eq('re', re)
            .maybeSingle();
          if (!error && data){
            found = {
              re:               data.re,
              dg:               data.dg,
              postoGrad:        data.posto_grad,
              nome:             data.nome,
              ciaSecao:         data.cia_secao        || '',
              dataNascimento:   data.data_nascimento  || '',
              dataExameOdonto:  data.ias_odonto       || '',
              dataExameMedico:  data.ias_medico       || '',
              validadeIAS:      data.validade_ias     || ''
            };
            origem = 'supabase';
          }
        } catch(e){
          console.warn('Falha ao consultar Supabase:', e);
        }
      }

      if (!found){
        const localFound = db.officers.find(x => x.re === re && (!officer || x.id !== officer.id));
        if (localFound){
          found = localFound;
          origem = 'local';
        }
      }

      if (!found) return;

      const setVal = (name, val) => {
        const el = form.elements[name];
        if (el) el.value = val || '';
      };
      setVal('dg',              found.dg);
      setVal('nome',            found.nome);
      setVal('ciaSecao',        found.ciaSecao || form.elements.ciaSecao.value);
      setVal('postoGrad',       found.postoGrad);
      setVal('dataNascimento',  found.dataNascimento);
      setVal('dataExameMedico', found.dataExameMedico);
      setVal('dataExameOdonto', found.dataExameOdonto);
      setVal('validadeIAS',     found.validadeIAS);

      if (found.categoria){
        catSel.value = found.categoria;
        refreshTurmas();
        turmaSel.value = found.turmaId || '';
      }

      if (found.taf){
        form.elements.taf.value = found.taf;
        if (found.taf === 'IV') form.elements.tafIVTipo.value = found.tafIVTipo || '';
        else                    form.elements.tafIVTipo.value = '';
      }

      if (origem === 'local'){
        inseridoSel.checked = (found.inseridoEAD === 'Sim');
        concluiuSel.checked = (found.concluiuEAD === 'Sim');
        if (concluiuSel.checked){
          form.elements.notaEAD.value          = found.notaEAD || '';
          form.elements.dataConclusaoEAD.value = found.dataConclusaoEAD || '';
        } else {
          form.elements.notaEAD.value          = '';
          form.elements.dataConclusaoEAD.value = '';
        }
      }

      updateTafIV(); updateEAD();

      if (origem === 'supabase'){
        autoFillText.textContent = 'Dados carregados da base central (Supabase)';
        autoFillBadge.classList.add('show');
      } else {
        autoFillText.textContent = 'Dados carregados do cache local';
        autoFillBadge.classList.add('show', 'warn');
      }
    }, 350);
  });

  document.getElementById('save-officer').addEventListener('click', async () => {
    if (!form.reportValidity()) return;
    const data = Object.fromEntries(new FormData(form).entries());

    data.inseridoEAD = inseridoSel.checked ? 'Sim' : 'Não';
    data.concluiuEAD = concluiuSel.checked ? 'Sim' : 'Não';

    if (data.taf !== 'IV') data.tafIVTipo = '';
    if (data.concluiuEAD !== 'Sim'){ data.notaEAD=''; data.dataConclusaoEAD=''; }
    if (data.inseridoEAD !== 'Sim'){ data.concluiuEAD='Não'; data.notaEAD=''; data.dataConclusaoEAD=''; }

    // Preserva ordem manual existente
    if (isEdit) data.ordemManual = officer.ordemManual;

    let enviadoSupabase = false;
    if (sb){
      try {
        const { error } = await sb.rpc('importar_policial', {
          p_re:              data.re,
          p_dg:              data.dg,
          p_posto_grad:      data.postoGrad,
          p_nome:            data.nome,
          p_su:              null,
          p_cia_secao:       data.ciaSecao         || null,
          p_data_nascimento: data.dataNascimento   || null,
          p_ias_odonto:      data.dataExameOdonto  || null,
          p_ias_medico:      data.dataExameMedico  || null,
          p_validade_ias:    data.validadeIAS      || null
        });
        if (!error) enviadoSupabase = true;
        else console.warn('RPC Supabase falhou:', error);
      } catch(e){
        console.warn('Falha ao enviar para Supabase:', e);
      }
    }

    if (isEdit){
      Object.assign(officer, data);
      toast('Policial atualizado.' + (enviadoSupabase ? ' Base central sincronizada.' : ''), 'success');
    } else {
      const existing = db.officers.find(x => x.re === data.re);
      if (existing){
        Object.assign(existing, data);
        toast('Policial atualizado (RE já cadastrado).' + (enviadoSupabase ? ' Base central sincronizada.' : ''), 'success');
      } else {
        data.id = uid();
        db.officers.push(data);
        toast('Policial adicionado.' + (enviadoSupabase ? ' Base central sincronizada.' : ''), 'success');
      }
    }
    saveDB(); render(); close();
  });
}

  document.getElementById('save-turma').addEventListener('click', () => {
    if (!form.reportValidity()) return;
    const fd = new FormData(form);

    if (isEdit){

  });
}
